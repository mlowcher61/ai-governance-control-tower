---
# Unit prices for the ESTIMATED AI operating cost (task T3.07, docs/plan/05 section 9.1).
#
# Collect Usage and Cost multiplies the usage it reads from Amazon CloudWatch by these prices:
#   * AgentCore runtimes: vCPU-hours x vcpu_hour + GB-hours x memory_gb_hour (CPUUsed-vCPUHours, MemoryUsed-GBHours)
#   * Foundation models:  input tokens / 1,000,000 x input_per_million_tokens + output tokens / 1,000,000 x output_per_million_tokens
# The result is labelled "estimate" everywhere. It is not your bill: AWS bills metered usage, which can differ.
#
# This repository ships NO price figures. Fill them in from your AWS price list or contract, here or (preferred, so
# each environment can differ) in aap_config/vars/customer.yml as aigov_unit_prices with the same structure; values set
# there override this file. Leave a price null to skip that estimate (the job reports "prices_not_set").
currency: USD
source: ""            # where the prices come from and when, e.g. "AWS AgentCore pricing page, 2026-11-28"
agentcore_runtime:
  vcpu_hour: null
  memory_gb_hour: null
models: {}
#  amazon.nova-lite-v1:0:
#    input_per_million_tokens: null
#    output_per_million_tokens: null
