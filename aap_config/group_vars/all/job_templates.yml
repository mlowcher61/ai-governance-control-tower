---
aigov_jt_defaults: &aigov_jt_defaults
  organization: "{{ aigov_organization }}"
  project: "{{ aigov_project_name }}"
  inventory: AI Governance - Localhost
  execution_environment: "{{ aigov_execution_environment }}"
  job_type: run
  verbosity: 0

aigov_base_templates:
  - name: AI Governance - Check Environment
    description: "T0.01 - read-only check of the execution environment, AWS identity and AgentCore availability"
    playbook: playbooks/platform/environment_check.yml
    credentials:
      - "{{ aigov_aws_bootstrap_credential }}"
    ask_credential_on_launch: true
    extra_vars:
      aigov_aws_region: "{{ aigov_aws_region }}"
    <<: *aigov_jt_defaults

aigov_aws_templates:
  - name: AI Governance - Deploy AWS Governance Roles
    description: "T0.07 - deploy the discovery, remediation and demo reset roles and approved policies (CloudFormation)"
    playbook: playbooks/aws/deploy_governance_roles.yml
    credentials:
      - "{{ aigov_aws_bootstrap_credential }}"
      - AI Governance - AWS Discovery Role
      - AI Governance - AWS Remediation Role
      - AI Governance - AWS Demo Reset Role
    extra_vars:
      aigov_aws_region: "{{ aigov_aws_region }}"
    <<: *aigov_jt_defaults

  - name: AI Governance - Deploy Demo Agents
    description: "T0.07 - deploy the four demo Amazon Bedrock AgentCore runtimes (CloudFormation, direct code deployment)"
    playbook: playbooks/demo/deploy_demo_agents.yml
    credentials:
      - "{{ aigov_aws_bootstrap_credential }}"
    extra_vars:
      aigov_aws_region: "{{ aigov_aws_region }}"
    <<: *aigov_jt_defaults

  - name: AI Governance - Verify AWS Baseline
    description: "T0.07 acceptance - least-privilege negative tests with the IAM policy simulator, run as the discovery role"
    playbook: playbooks/aws/verify_aws_baseline.yml
    credentials:
      - "{{ aigov_aws_bootstrap_credential }}"
      - AI Governance - AWS Discovery Role
    extra_vars:
      aigov_aws_region: "{{ aigov_aws_region }}"
    <<: *aigov_jt_defaults

# T1.06: discovery. Needs the AWS account (role credentials) and the platform (Inventory API credentials).
aigov_discovery_templates:
  - name: AI Governance - Discover AI Agents
    description: "T1.06 - discover AI agents with the read-only role and record them in the Inventory API"
    playbook: playbooks/discovery/discover_ai_agents.yml
    credentials:
      - "{{ aigov_aws_bootstrap_credential }}"
      - AI Governance - AWS Discovery Role
      - AI Governance - Inventory API (discovery)
    ask_variables_on_launch: true
    extra_vars:
      aigov_aws_account_id: "{{ aigov_aws_account_id | string }}"
      aigov_aws_region: "{{ aigov_aws_region }}"
      aigov_scope_name: ""
      aigov_governance_run_id: ""
    <<: *aigov_jt_defaults

  - name: AI Governance - Load Governance Registry
    description: "T1.07 - load owners and agent registrations from inventory/registry/ (Git is authoritative) and re-match agents"
    playbook: playbooks/registry/load_registry.yml
    credentials:
      - AI Governance - Inventory API (registry)
    extra_vars:
      aigov_aws_account_id: "{{ aigov_aws_account_id | string }}"
    <<: *aigov_jt_defaults

  - name: AI Governance - Check Inventory
    description: "T1.06 acceptance - read-only checks of the inventory and the policy inputs (evaluator role)"
    playbook: playbooks/discovery/check_inventory.yml
    credentials:
      - AI Governance - Inventory API (evaluator)
    ask_variables_on_launch: true
    <<: *aigov_jt_defaults

# T0.06: governance platform services on OpenShift. Needs an existing AAP credential of type
# "OpenShift or Kubernetes API Bearer Token" (aigov_openshift_credential).
aigov_platform_templates:
  - name: AI Governance - Deploy Platform Services
    description: "T0.06 - deploy PostgreSQL, PostgREST, OPA and Grafana with NetworkPolicies into the governance namespace"
    playbook: playbooks/platform/deploy_services.yml
    credentials:
      - "{{ aigov_openshift_credential }}"
    extra_vars:
      aigov_platform_namespace: "{{ aigov_platform_namespace }}"
      aigov_platform_trusted_namespaces: "{{ aigov_platform_trusted_namespaces }}"
    <<: *aigov_jt_defaults

  - name: AI Governance - Publish Governance Policies
    description: "T1.08 - test the Rego policies with the server's OPA image, publish them, verify the golden decisions (refuses or rolls back)"
    playbook: playbooks/policies/publish_policies.yml
    credentials:
      - "{{ aigov_openshift_credential }}"
    ask_variables_on_launch: true
    extra_vars:
      aigov_platform_namespace: "{{ aigov_platform_namespace }}"
      aigov_publish_self_test: false
    <<: *aigov_jt_defaults

  - name: AI Governance - Apply Database Migrations
    description: "T1.01 - apply database/migrations (forward-only, checksum-verified) with a Kubernetes Job"
    playbook: playbooks/platform/db_migrate.yml
    credentials:
      - "{{ aigov_openshift_credential }}"
    extra_vars:
      aigov_platform_namespace: "{{ aigov_platform_namespace }}"
    <<: *aigov_jt_defaults

# T1.02: Inventory API tokens. Also needs an existing AAP credential of type "Red Hat Ansible Automation
# Platform" (aigov_aap_credential) that may update the Inventory API credentials.
aigov_api_templates:
  - name: AI Governance - Issue API Tokens
    description: "T1.02 - sign one Inventory API JWT per PostgreSQL role, test them, and store them in the AAP credentials"
    playbook: playbooks/platform/issue_api_tokens.yml
    credentials:
      - "{{ aigov_openshift_credential }}"
      - "{{ aigov_aap_credential }}"
    extra_vars:
      aigov_platform_namespace: "{{ aigov_platform_namespace }}"
      aigov_organization: "{{ aigov_organization }}"
      aigov_api_token_ttl_days: "{{ aigov_api_token_ttl_days | default(90) }}"
    <<: *aigov_jt_defaults

# T0.08: automation orchestrator config as code and the workflow loader.
aigov_ao_templates:
  - name: AI Governance - Configure Automation Orchestrator
    description: "T0.08 - check AO integrations, credentials, trigger service account and SSRF allowlist (reports admin actions)"
    playbook: ao_workflows/configure_ao.yml
    credentials:
      - AI Governance - Automation Orchestrator
    extra_vars:
      aigov_aap_hostname: "{{ aigov_aap_hostname }}"
    <<: *aigov_jt_defaults

  - name: AI Governance - Apply AO Workflows
    description: "T0.08 - render, validate, create/update and publish the governance workflows in ao_workflows/definitions/"
    playbook: ao_workflows/apply_workflows.yml
    credentials:
      - AI Governance - Automation Orchestrator
    ask_variables_on_launch: true
    extra_vars:
      aigov_ao_validate_only: false
    <<: *aigov_jt_defaults

# AO SSRF allowlist at the deployment level (needs the OpenShift credential and aigov_ao_url).
aigov_ao_platform_templates:
  - name: AI Governance - Configure AO Network Allowlist
    description: "T0.08 - merge the AAP, OPA and Inventory API hosts into the AO SSRF allowlist (ao-admin-settings) and restart AO if it changed"
    playbook: playbooks/platform/ao_network_allowlist.yml
    credentials:
      - "{{ aigov_openshift_credential }}"
    extra_vars:
      aigov_aap_hostname: "{{ aigov_aap_hostname }}"
      aigov_platform_namespace: "{{ aigov_platform_namespace }}"
      aigov_ao_namespace: "{{ aigov_ao_namespace | default('automation-orchestrator') }}"
    <<: *aigov_jt_defaults

controller_templates: >-
  {{ aigov_base_templates
     + (aigov_aws_templates if (aigov_aws_account_id | string | length) == 12 else [])
     + (aigov_platform_templates if (aigov_openshift_credential | default('') | string | length) > 0 else [])
     + (aigov_discovery_templates if (aigov_aws_account_id | string | length) == 12
                                     and (aigov_openshift_credential | default('') | string | length) > 0 else [])
     + (aigov_api_templates if (aigov_openshift_credential | default('') | string | length) > 0
                               and (aigov_aap_credential | default('') | string | length) > 0 else [])
     + (aigov_ao_templates if (aigov_ao_url | default('') | length) > 0 else [])
     + (aigov_ao_platform_templates if (aigov_ao_url | default('') | length) > 0
                                       and (aigov_openshift_credential | default('') | string | length) > 0 else []) }}
