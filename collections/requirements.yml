# configured as the organization's Galaxy credentials). Versions are pinned to
# the certified/validated content verified on the hub (see docs/plan/06).
collections:
  - name: amazon.aws
    version: "11.5.0"
  - name: amazon.ai
    version: "1.0.1"
  # 6.1.1 is pinned out: its artifact on the private hub fails hash verification
  # ("Mismatch artifact hash"), verified 2026-11-17. Re-sync the hub, then move to 6.1.1.
  - name: ansible.utils
    version: "6.1.0"
  - name: kubernetes.core
    version: "6.6.0"
  # Project collection (custom read-only/gap modules), installed from this repo
  - name: ./collections/ansible_collections/mlowcher61/ai_governance
    type: dir
