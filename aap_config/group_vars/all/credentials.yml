---
aigov_hub_token: "{{ lookup('ansible.builtin.env', 'AIGOV_HUB_TOKEN') | default(lookup('ansible.builtin.env', 'AAP_API_TOKEN'), true) }}"

# Source Control token for a private project repository ($AIGOV_SCM_TOKEN, falls back to $GITHUB_TOKEN).
# Leave both unset for a public repository: no SCM credential is created.
aigov_scm_token: "{{ lookup('ansible.builtin.env', 'AIGOV_SCM_TOKEN') | default(lookup('ansible.builtin.env', 'GITHUB_TOKEN'), true) }}"

aigov_scm_credentials:
  - name: AI Governance - GitHub
    description: Source Control access to the private project repository
    organization: "{{ aigov_organization }}"
    credential_type: Source Control
    inputs:
      username: "{{ aigov_project_scm_username }}"
      password: "{{ aigov_scm_token }}"

aigov_base_credentials:
  - name: AI Governance - Private Hub Certified
    description: Private automation hub (certified content) for project collection installs
    organization: "{{ aigov_organization }}"
    credential_type: Ansible Galaxy/Automation Hub API Token
    inputs:
      url: "{{ aigov_private_hub_url }}/rh-certified/"
      token: "{{ aigov_hub_token }}"
  - name: AI Governance - Private Hub Validated
    description: Private automation hub (validated content) for project collection installs
    organization: "{{ aigov_organization }}"
    credential_type: Ansible Galaxy/Automation Hub API Token
    inputs:
      url: "{{ aigov_private_hub_url }}/validated/"
      token: "{{ aigov_hub_token }}"

# Governance role credentials need the AWS account ID (role ARNs). External IDs are
# generated randomly on first creation and are never overwritten afterwards
# (update_secrets: false); the deploy job reads them from these credentials.
aigov_role_credentials:
  - name: AI Governance - AWS Discovery Role
    description: Assumes AIGovDiscoveryRole (read-only)
    organization: "{{ aigov_organization }}"
    credential_type: AI Governance - AWS Discovery Role
    update_secrets: false
    inputs:
      role_arn: "arn:aws:iam::{{ aigov_aws_account_id }}:role/aigov/AIGovDiscoveryRole"
      external_id: "{{ lookup('ansible.builtin.password', '/dev/null', length=40, chars=['ascii_letters', 'digits']) }}"
  - name: AI Governance - AWS Remediation Role
    description: Assumes AIGovRemediationRole (approved, scoped remediation only)
    organization: "{{ aigov_organization }}"
    credential_type: AI Governance - AWS Remediation Role
    update_secrets: false
    inputs:
      role_arn: "arn:aws:iam::{{ aigov_aws_account_id }}:role/aigov/AIGovRemediationRole"
      external_id: "{{ lookup('ansible.builtin.password', '/dev/null', length=40, chars=['ascii_letters', 'digits']) }}"
  - name: AI Governance - AWS Demo Reset Role
    description: Assumes AIGovDemoResetRole (demo-tagged resources only)
    organization: "{{ aigov_organization }}"
    credential_type: AI Governance - AWS Demo Reset Role
    update_secrets: false
    inputs:
      role_arn: "arn:aws:iam::{{ aigov_aws_account_id }}:role/aigov/AIGovDemoResetRole"
      external_id: "{{ lookup('ansible.builtin.password', '/dev/null', length=40, chars=['ascii_letters', 'digits']) }}"

# Registry credential AAP uses to pull the AI Governance EE (aigov_ee_registry_credential on
# aigov_ee_registry_host). Either reference an existing Container Registry credential by name, or
# export AIGOV_REGISTRY_USERNAME/AIGOV_REGISTRY_PASSWORD to have it created/updated here.
# Note: a private automation hub registry needs a hub username/password; an AAP API token only
# yields an anonymous registry token.
aigov_registry_username: "{{ lookup('ansible.builtin.env', 'AIGOV_REGISTRY_USERNAME') }}"
aigov_registry_password: "{{ lookup('ansible.builtin.env', 'AIGOV_REGISTRY_PASSWORD') }}"
aigov_registry_credentials:
  - name: "{{ aigov_ee_registry_credential }}"
    description: Pull the AI Governance EE from {{ aigov_ee_registry_host }}
    organization: "{{ aigov_organization }}"
    credential_type: Container Registry
    inputs:
      host: "{{ aigov_ee_registry_host }}"
      username: "{{ aigov_registry_username }}"
      password: "{{ aigov_registry_password }}"
      verify_ssl: true

# automation orchestrator credential. Created when aigov_ao_url is set. The client ID and secret of the
# aigov-trigger service account are written by ao_workflows/configure_ao.yml (issued once, never printed),
# or supplied here from $AIGOV_AO_CLIENT_ID / $AIGOV_AO_CLIENT_SECRET. Existing secrets are never overwritten.
# state "exists" (unless the client values are supplied here): configure_ao.yml writes the client ID and secret,
# and this playbook must never change them. With "present", an empty client_id would count as a change and
# the update would wipe the stored client credentials.
aigov_ao_credentials:
  - name: AI Governance - Automation Orchestrator
    description: automation orchestrator URL and the aigov-trigger service account client credentials
    organization: "{{ aigov_organization }}"
    credential_type: AI Governance - Automation Orchestrator
    update_secrets: false
    state: "{{ 'present' if lookup('ansible.builtin.env', 'AIGOV_AO_CLIENT_SECRET') | length > 0 else 'exists' }}"
    inputs:
      ao_url: "{{ aigov_ao_url }}"
      client_id: "{{ lookup('ansible.builtin.env', 'AIGOV_AO_CLIENT_ID') }}"
      client_secret: "{{ lookup('ansible.builtin.env', 'AIGOV_AO_CLIENT_SECRET') }}"

# Governance Inventory API: one credential per PostgreSQL API role. Created here with an empty token;
# "AI Governance - Issue API Tokens" signs the tokens and writes them in. Existing tokens are never
# overwritten by this playbook (update_secrets: false). The empty 'token' key must stay: without it the
# input keys differ from the stored credential, and the module would PATCH the token away.
# ServiceNow (T2.10): created once; the instance and account are entered in AAP (or exported as AIGOV_SERVICENOW_* when
# running configure_aap.yml) and never overwritten. An empty instance means notifications are skipped and only audited.
aigov_servicenow_credentials:
  - name: AI Governance - ServiceNow
    description: ServiceNow instance and account for WF-02 incidents (empty instance = notifications skipped)
    organization: "{{ aigov_organization }}"
    credential_type: AI Governance - ServiceNow
    update_secrets: false
    state: "{{ 'present' if lookup('ansible.builtin.env', 'AIGOV_SERVICENOW_PASSWORD') | length > 0 else 'exists' }}"
    inputs:
      instance: "{{ aigov_servicenow_instance | default('', true) }}"
      username: "{{ lookup('ansible.builtin.env', 'AIGOV_SERVICENOW_USERNAME') }}"
      password: "{{ lookup('ansible.builtin.env', 'AIGOV_SERVICENOW_PASSWORD') }}"
      assignment_group: "{{ aigov_servicenow_assignment_group | default('', true) }}"

aigov_api_roles: [discovery, registry, evaluator, remediator, reader, auditor]
aigov_api_credentials: >-
  {%- set creds = [] -%}
  {%- for role in aigov_api_roles -%}
  {%- set _ = creds.append({
        'name': 'AI Governance - Inventory API (' ~ role ~ ')',
        'description': 'Governance Inventory API token for PostgreSQL role aigov_' ~ role,
        'organization': aigov_organization,
        'credential_type': 'AI Governance - Inventory API',
        'update_secrets': false,
        'inputs': {'api_url': 'http://governance-api.' ~ aigov_platform_namespace ~ '.svc:3000',
                   'role': 'aigov_' ~ role, 'token': ''}}) -%}
  {%- endfor -%}
  {{ creds }}

controller_credentials: >-
  {{ aigov_base_credentials
     + (aigov_registry_credentials if (aigov_registry_password | length) > 0 else [])
     + (aigov_scm_credentials if (aigov_scm_token | length) > 0 else [])
     + (aigov_ao_credentials if (aigov_ao_url | default('') | length) > 0 else [])
     + aigov_servicenow_credentials
     + (aigov_api_credentials if (aigov_openshift_credential | default('') | string | length) > 0 else [])
     + (aigov_role_credentials if (aigov_aws_account_id | string | length) == 12 else []) }}
