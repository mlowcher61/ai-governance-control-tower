---
# AI Governance - Issue EDA Credentials (task T3.02)
#
# Event-Driven Ansible needs two secrets, which this job creates and writes straight into EDA credentials (never into
# Git, never printed):
#   * "AI Governance - EDA Queue Reader" - a NEW access key for the IAM user aigov-eda-reader (stack aigov-events; may
#     only receive/delete messages on the change-event queue); older keys of that user are deleted afterwards;
#   * "AI Governance - EDA AAP Service Account" - the AAP user svc-aigov-eda with a new random password; it may run only
#     "AI Governance - Process Change Event".
# Then the activation "AI Governance - AWS Change Events" (if it exists) is restarted so it uses them. Run it once after
# Deploy AWS Event Plumbing and configure_aap.yml, then again to rotate.
#
# Credentials: the AWS bootstrap credential, the AAP credential (aigov_aap_credential, an AAP administrator).
- name: AI Governance - issue the EDA credentials
  hosts: localhost
  connection: local
  gather_facts: false
  vars:
    aigov_aws_region: us-west-1
    aigov_organization: AI Governance
    aigov_eda_reader_user: aigov-eda-reader
    aigov_eda_service_user: svc-aigov-eda
    aigov_eda_queue_credential: AI Governance - EDA Queue Reader
    aigov_eda_aap_credential: AI Governance - EDA AAP Service Account
    aigov_eda_queue_credential_type: AI Governance - AWS SQS Reader
    aigov_eda_activation: AI Governance - AWS Change Events
  tasks:
    - name: Connect to AAP with the attached credential
      ansible.builtin.include_tasks: ../e2e/tasks/aap_connection.yml

    # ---- 1. AWS access key for the queue reader --------------------------------------------------------------
    - name: Read the queue reader's current access keys
      amazon.aws.iam_access_key_info:
        user_name: "{{ aigov_eda_reader_user }}"
        region: "{{ aigov_aws_region }}"
      register: aigov_old_keys

    - name: Create a new access key (the oldest is removed if the user already has two)
      amazon.aws.iam_access_key:
        user_name: "{{ aigov_eda_reader_user }}"
        state: present
        rotate_keys: true
        region: "{{ aigov_aws_region }}"
      register: aigov_new_key
      no_log: true

    # ---- 2. AAP password for the EDA service account ---------------------------------------------------------
    - name: Find the EDA service account user
      ansible.builtin.uri:
        url: "{{ aigov_aap_url }}/api/gateway/v1/users/?username={{ aigov_eda_service_user }}"
        headers: "{{ aigov_aap_auth_headers }}"
        url_username: "{{ omit if aigov_aap_auth_headers else aigov_aap_user }}"
        url_password: "{{ omit if aigov_aap_auth_headers else aigov_aap_password }}"
        force_basic_auth: "{{ not aigov_aap_auth_headers }}"
        validate_certs: "{{ aigov_aap_verify }}"
      register: aigov_svc_user
      no_log: true

    - name: Check the user exists (configure_aap.yml creates it)
      ansible.builtin.assert:
        that: aigov_svc_user.json.results | length == 1
        fail_msg: "AAP user {{ aigov_eda_service_user }} not found: run aap_config/configure_aap.yml first."
        quiet: true

    - name: Set a new password
      vars:
        aigov_pw: "{{ lookup('ansible.builtin.password', '/dev/null', length=48, chars=['ascii_letters', 'digits']) }}"
      ansible.builtin.set_fact:
        aigov_svc_password: "{{ aigov_pw }}"
      no_log: true

    - name: Set the password in AAP
      ansible.builtin.uri:
        url: "{{ aigov_aap_url }}/api/gateway/v1/users/{{ aigov_svc_user.json.results[0].id }}/"
        method: PATCH
        body_format: json
        body: {password: "{{ aigov_svc_password }}"}
        headers: "{{ aigov_aap_auth_headers }}"
        url_username: "{{ omit if aigov_aap_auth_headers else aigov_aap_user }}"
        url_password: "{{ omit if aigov_aap_auth_headers else aigov_aap_password }}"
        force_basic_auth: "{{ not aigov_aap_auth_headers }}"
        validate_certs: "{{ aigov_aap_verify }}"
      no_log: true

    # ---- 3. EDA credentials ---------------------------------------------------------------------------------
    - name: Read EDA organizations, credential types and credentials
      ansible.builtin.uri:
        url: "{{ aigov_aap_url }}/api/eda/v1/{{ item }}/?page_size=200"
        headers: "{{ aigov_aap_auth_headers }}"
        url_username: "{{ omit if aigov_aap_auth_headers else aigov_aap_user }}"
        url_password: "{{ omit if aigov_aap_auth_headers else aigov_aap_password }}"
        force_basic_auth: "{{ not aigov_aap_auth_headers }}"
        validate_certs: "{{ aigov_aap_verify }}"
      loop: [organizations, credential-types, eda-credentials, activations]
      register: aigov_eda
      no_log: true

    - name: Prepare the two EDA credentials
      ansible.builtin.set_fact:
        aigov_eda_creds:
          - name: "{{ aigov_eda_queue_credential }}"
            description: Access key of IAM user aigov-eda-reader (issued by AI Governance - Issue EDA Credentials)
            type: "{{ aigov_eda_queue_credential_type }}"
            inputs: {access_key: "{{ aigov_new_key.access_key.access_key_id }}", secret_key: "{{ aigov_new_key.secret_access_key }}"}
          - name: "{{ aigov_eda_aap_credential }}"
            description: AAP user svc-aigov-eda, may run only Process Change Event (issued by AI Governance - Issue EDA Credentials)
            type: Red Hat Ansible Automation Platform
            inputs:
              host: "{{ aigov_aap_url }}/api/controller/"
              username: "{{ aigov_eda_service_user }}"
              password: "{{ aigov_svc_password }}"
              verify_ssl: "{{ aigov_aap_verify | bool }}"
      no_log: true

    - name: Create or update each EDA credential
      vars:
        aigov_existing: "{{ aigov_eda.results[2].json.results | selectattr('name', 'equalto', item.name) | list }}"
      ansible.builtin.uri:
        url: >-
          {{ aigov_aap_url }}/api/eda/v1/eda-credentials/{{ (aigov_existing[0].id ~ '/') if aigov_existing else '' }}
        method: "{{ 'PATCH' if aigov_existing else 'POST' }}"
        body_format: json
        body: >-
          {{ {'inputs': item.inputs} if aigov_existing else
             {'name': item.name, 'description': item.description, 'inputs': item.inputs,
              'credential_type_id': aigov_eda.results[1].json.results | selectattr('name', 'equalto', item.type) | map(attribute='id') | first,
              'organization_id': aigov_eda.results[0].json.results | selectattr('name', 'equalto', aigov_organization) | map(attribute='id') | first} }}
        headers: "{{ aigov_aap_auth_headers }}"
        url_username: "{{ omit if aigov_aap_auth_headers else aigov_aap_user }}"
        url_password: "{{ omit if aigov_aap_auth_headers else aigov_aap_password }}"
        force_basic_auth: "{{ not aigov_aap_auth_headers }}"
        validate_certs: "{{ aigov_aap_verify }}"
        status_code: [200, 201]
      loop: "{{ aigov_eda_creds }}"
      loop_control:
        label: "{{ item.name }}"
      changed_when: true
      no_log: true

    - name: Delete the queue reader's older access keys
      amazon.aws.iam_access_key:
        user_name: "{{ aigov_eda_reader_user }}"
        id: "{{ item }}"
        state: absent
        region: "{{ aigov_aws_region }}"
      loop: >-
        {{ aigov_old_keys.access_keys | map(attribute='access_key_id')
           | reject('equalto', aigov_new_key.deleted_access_key_id | default('')) | list }}

    - name: Restart the activation so it uses the new credentials
      vars:
        aigov_act: "{{ aigov_eda.results[3].json.results | selectattr('name', 'equalto', aigov_eda_activation) | list }}"
      when: aigov_act | length > 0
      ansible.builtin.uri:
        url: "{{ aigov_aap_url }}/api/eda/v1/activations/{{ aigov_act[0].id }}/restart/"
        method: POST
        headers: "{{ aigov_aap_auth_headers }}"
        url_username: "{{ omit if aigov_aap_auth_headers else aigov_aap_user }}"
        url_password: "{{ omit if aigov_aap_auth_headers else aigov_aap_password }}"
        force_basic_auth: "{{ not aigov_aap_auth_headers }}"
        validate_certs: "{{ aigov_aap_verify }}"
        status_code: [200, 202, 204, 409]
      changed_when: true

    - name: Report
      ansible.builtin.debug:
        msg: >-
          EDA credentials issued: "{{ aigov_eda_queue_credential }}" (new access key for {{ aigov_eda_reader_user }};
          {{ aigov_old_keys.access_keys | length }} older key(s) removed) and "{{ aigov_eda_aap_credential }}"
          ({{ aigov_eda_service_user }}, new password). Set aigov_eda_enabled: true in customer.yml and re-run
          configure_aap.yml if the activation does not exist yet.
