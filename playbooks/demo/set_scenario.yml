---
# AI Governance - Set Demo Scenario (task T2.12, testing; docs/plan/09 section 5)
#
# Puts the demo agent quick_helper_bot into a test state with the demo reset role (demo-tagged resources only):
#   development_environment - tag Environment=development: REG-001's tag fix becomes eligible for AUTOMATIC remediation
#                             (only development and sandbox may skip approval);
#   required_tags           - add the governance tags production agents need (Owner, Environment=production,
#                             CostCenter; DataClassification is already set): TAG-001 passes, so an open TAG-001
#                             finding is stale (failure case F-17, WF-02 branch "no longer detected");
#   developer_tag           - AS THE BOOTSTRAP USER (not a governance role), add a timestamped test tag to the runtime:
#                             a change Event-Driven Ansible must act on (T3.02);
#   developer_attach        - AS THE BOOTSTRAP USER, attach the approved (least-privilege) policy to the agent's role:
#                             an IAM change Event-Driven Ansible must act on (T3.02);
#   developer_grant_admin   - AS THE BOOTSTRAP USER, attach AdministratorAccess to the COMPLIANT agent
#                             payments_dispute_assistant's role: a privilege escalation that WF-03 must turn into a new
#                             IAM-001 violation and a WF-02 run (T3.03).
# Existing tags are kept. Run AI Governance - Reset Demo Environment to return to the baseline (it restores the exact
# baseline tags). Run discovery afterwards when the inventory must see the new state (WF-02 reassesses live anyway).
#
# Credentials: the AWS bootstrap credential, "AI Governance - AWS Demo Reset Role".
- name: AI Governance - set a demo scenario
  hosts: localhost
  connection: local
  gather_facts: false
  vars:
    aigov_aws_region: us-west-1
    aigov_demo_stack_name: aigov-demo-agents
    aigov_scenario: ""
    aigov_scenarios:
      development_environment:
        QuickHelperBotRuntimeArn: {Environment: development}
      required_tags:
        QuickHelperBotRuntimeArn: {Owner: platform-team@example.com, Environment: production, CostCenter: CC-4242}
      developer_tag:
        QuickHelperBotRuntimeArn: {"aigov:test-change": "{{ now(utc=true, fmt='%Y%m%dT%H%M%SZ') }}"}
      developer_attach: {}
      developer_grant_admin: {}
    aigov_bootstrap_scenarios: [developer_tag, developer_attach, developer_grant_admin]
    aigov_escalation_role: aigov-demo-payments-dispute-assistant
    aigov_governance_stack_name: aigov-governance-roles
    aigov_developer_role: aigov-demo-quick-helper-bot
  tasks:
    - name: Check the scenario and the credential
      ansible.builtin.assert:
        that:
          - aigov_scenario in aigov_scenarios
          - aigov_demo_reset_role_arn | default('') | length > 0
        fail_msg: "Pass aigov_scenario ({{ aigov_scenarios | list | join(' or ') }}) and attach the AWS Demo Reset Role credential."
        quiet: true

    - name: Read the demo stack outputs
      amazon.aws.cloudformation_info:
        stack_name: "{{ aigov_demo_stack_name }}"
        region: "{{ aigov_aws_region }}"
      register: aigov_demo_stack

    - name: Assume the demo reset role (demo-tagged resources only)
      amazon.aws.sts_assume_role:
        role_arn: "{{ aigov_demo_reset_role_arn }}"
        external_id: "{{ aigov_demo_reset_external_id }}"
        role_session_name: "aigov-demo-scenario-{{ tower_job_id | default(awx_job_id) | default('local') }}"
        duration_seconds: 900
        region: "{{ aigov_aws_region }}"
      register: aigov_session
      no_log: true

    - name: Apply the scenario tags
      mlowcher61.ai_governance.agentcore_runtime_tags:
        # developer scenarios act as the bootstrap user (credential from the environment), not as a governance role
        access_key: "{{ omit if aigov_scenario in aigov_bootstrap_scenarios else aigov_session.sts_creds.access_key }}"
        secret_key: "{{ omit if aigov_scenario in aigov_bootstrap_scenarios else aigov_session.sts_creds.secret_key }}"
        session_token: "{{ omit if aigov_scenario in aigov_bootstrap_scenarios else aigov_session.sts_creds.session_token }}"
        region: "{{ aigov_aws_region }}"
        resource_arn: "{{ aigov_demo_stack.cloudformation[aigov_demo_stack_name].stack_outputs[item.key] }}"
        tags: "{{ item.value }}"
        purge_tags: false
      loop: "{{ aigov_scenarios[aigov_scenario] | dict2items }}"
      loop_control:
        label: "{{ item.key }}"
      register: aigov_scenario_tags

    - name: Read the approved policy (developer_attach)
      when: aigov_scenario == 'developer_attach'
      amazon.aws.cloudformation_info:
        stack_name: "{{ aigov_governance_stack_name }}"
        region: "{{ aigov_aws_region }}"
      register: aigov_gov_stack

    - name: Attach the approved policy as the bootstrap user (developer_attach)
      when: aigov_scenario == 'developer_attach'
      mlowcher61.ai_governance.iam_role_managed_policies:
        region: "{{ aigov_aws_region }}"
        role_name: "{{ aigov_developer_role }}"
        managed_policies: ["{{ aigov_gov_stack.cloudformation[aigov_governance_stack_name].stack_outputs.ApprovedAgentRuntimePolicyArn }}"]
        purge_policies: false
      register: aigov_scenario_iam

    - name: Attach AdministratorAccess as the bootstrap user (developer_grant_admin)
      when: aigov_scenario == 'developer_grant_admin'
      mlowcher61.ai_governance.iam_role_managed_policies:
        region: "{{ aigov_aws_region }}"
        role_name: "{{ aigov_escalation_role }}"
        managed_policies: ["arn:aws:iam::aws:policy/AdministratorAccess"]
        purge_policies: false
      register: aigov_scenario_admin

    - name: Report the scenario
      ansible.builtin.debug:
        msg: >-
          Scenario {{ aigov_scenario }} applied: tags {{ aigov_scenario_tags.results | default([]) | map(attribute='added') | list }}
          {{ ('attached ' ~ aigov_scenario_iam.attached) if aigov_scenario_iam.attached is defined else '' }}
          {{ ('attached to ' ~ aigov_escalation_role ~ ' ' ~ aigov_scenario_admin.attached) if aigov_scenario_admin.attached is defined else '' }}
