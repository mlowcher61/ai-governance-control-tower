---
# Give the trigger service account (aigov-trigger) a client credential and store it in the AAP
# credential "AI Governance - Automation Orchestrator". AO shows a client secret only once, so a new one
# is issued only when AAP does not hold a working one (no active AO credential, or the AAP credential's
# client ID is empty or not an active AO credential), written straight into AAP (no_log), and never printed.
# Active credentials that AAP no longer holds are then DISABLED (reversible): their secrets exist nowhere.
# Needs AAP API access: $AAP_SERVER and $AAP_API_TOKEN (workstation),
# or aigov_aap_hostname and aigov_aap_token. Without it, the step is reported as an admin action.
- name: Find the trigger service account
  ansible.builtin.uri:
    url: "{{ aigov_ao_api }}/service_accounts"
    headers: "{{ aigov_ao_headers }}"
    validate_certs: "{{ aigov_ao_validate_certs }}"
  register: aigov_ao_sas_now

- name: Set the trigger service account ID
  ansible.builtin.set_fact:
    aigov_ao_sa_id: >-
      {{ aigov_ao_sas_now.json.resources | selectattr('name', 'equalto', aigov_ao_trigger_service_account)
         | map(attribute='id') | first }}
    aigov_aap_api_host: "{{ aigov_aap_hostname | default(lookup('ansible.builtin.env', 'AAP_SERVER'), true) | default('', true) }}"
    aigov_aap_api_token: "{{ aigov_aap_token | default(lookup('ansible.builtin.env', 'AAP_API_TOKEN'), true) | default('', true) }}"
  no_log: true

- name: Read the trigger service account credentials
  ansible.builtin.uri:
    url: "{{ aigov_ao_api }}/service_accounts/{{ aigov_ao_sa_id }}/credentials"
    headers: "{{ aigov_ao_headers }}"
    validate_certs: "{{ aigov_ao_validate_certs }}"
    status_code: [200, 403]
  register: aigov_ao_sa_creds

- name: Find the AAP credential that receives the client credential
  when: aigov_aap_api_token | length > 0
  ansible.builtin.uri:
    url: "https://{{ aigov_aap_api_host }}/api/controller/v2/credentials/?name={{ aigov_ao_aap_credential_name | urlencode }}"
    headers:
      Authorization: "Bearer {{ aigov_aap_api_token }}"
    validate_certs: "{{ aigov_aap_validate_certs | default(true) }}"
  register: aigov_aap_ao_cred

- name: Decide whether a credential must be issued
  vars:
    aigov_active_ids: >-
      {{ (aigov_ao_sa_creds.json.resources | default([])) | selectattr('status', 'equalto', 'active')
         | map(attribute='identifier') | list }}
    aigov_aap_client_id: >-
      {{ ((aigov_aap_ao_cred.json.results | default([{}]))[0].inputs | default({})).client_id | default('') }}
  ansible.builtin.set_fact:
    aigov_ao_sa_needs_cred: >-
      {{ aigov_ao_sa_creds.status == 200 and
         (aigov_active_ids | length == 0 or
          (aigov_aap_api_token | length > 0 and aigov_aap_client_id not in aigov_active_ids)) }}

- name: Report a credential that cannot be issued and stored automatically
  when: >-
    aigov_ao_sa_needs_cred | bool and
    (aigov_aap_api_token | length == 0 or (aigov_aap_ao_cred.json.count | default(0)) == 0)
  ansible.builtin.set_fact:
    aigov_ao_actions: >-
      {{ aigov_ao_actions + ['Issue a client credential for the AO service account "' ~ aigov_ao_trigger_service_account
         ~ '" and store it in the AAP credential "' ~ aigov_ao_aap_credential_name ~ '" (run aap_config/configure_aap.yml with'
         ~ ' aigov_ao_url set first, then re-run this playbook from a workstation with AAP_SERVER and AAP_API_TOKEN)'] }}

- name: Issue the client credential and store it in AAP
  when:
    - aigov_ao_sa_needs_cred | bool
    - aigov_aap_api_token | length > 0
    - (aigov_aap_ao_cred.json.count | default(0)) == 1
  block:
    - name: Issue a client credential for the trigger service account
      ansible.builtin.uri:
        url: "{{ aigov_ao_api }}/service_accounts/{{ aigov_ao_sa_id }}/credentials"
        method: POST
        body_format: json
        body:
          credential_type: client_credentials
        headers: "{{ aigov_ao_headers }}"
        validate_certs: "{{ aigov_ao_validate_certs }}"
        status_code: [200, 201]
      register: aigov_ao_sa_new_cred
      changed_when: true
      no_log: true

    - name: Write the client ID and secret into the AAP credential
      ansible.builtin.uri:
        url: "https://{{ aigov_aap_api_host }}/api/controller/v2/credentials/{{ aigov_aap_ao_cred.json.results[0].id }}/"
        method: PATCH
        body_format: json
        body:
          inputs:
            ao_url: "{{ aigov_aap_ao_cred.json.results[0].inputs.ao_url }}"
            client_id: "{{ aigov_ao_sa_new_cred.json.identifier }}"
            client_secret: "{{ aigov_ao_sa_new_cred.json.client_secret }}"
        headers:
          Authorization: "Bearer {{ aigov_aap_api_token }}"
        validate_certs: "{{ aigov_aap_validate_certs | default(true) }}"
      changed_when: true
      no_log: true

    - name: Confirm the trigger credential was stored
      ansible.builtin.debug:
        msg: >-
          Issued a client credential ({{ aigov_ao_sa_new_cred.json.identifier }}, expires
          {{ aigov_ao_sa_new_cred.json.expires_at }}) for {{ aigov_ao_trigger_service_account }} and stored it in the
          AAP credential "{{ aigov_ao_aap_credential_name }}".

    - name: Disable active credentials that AAP no longer holds (their secrets exist nowhere)
      ansible.builtin.uri:
        url: "{{ aigov_ao_api }}/service_accounts/{{ aigov_ao_sa_id }}/credentials/{{ item.id }}/disable"
        method: POST
        headers: "{{ aigov_ao_headers }}"
        validate_certs: "{{ aigov_ao_validate_certs }}"
        status_code: [200, 201, 204]
      loop: >-
        {{ aigov_ao_sa_creds.json.resources | selectattr('status', 'equalto', 'active')
           | rejectattr('identifier', 'equalto', aigov_ao_sa_new_cred.json.identifier) | list }}
      loop_control:
        label: "{{ item.identifier }}"
      changed_when: true
