---
# The AI Governance EE is registered here when aigov_custom_ee_image is set. Leave it empty to use an
# execution environment that already exists in AAP (set aigov_execution_environment to its name).
# A registry credential is attached only when aigov_ee_registry_credential is set (private images).
aigov_custom_ee:
  name: AI Governance EE
  description: AAP 2.7 minimal EE + certified AWS collections + boto3 with AgentCore clients
  image: "{{ aigov_custom_ee_image }}"
  pull: missing
  organization: "{{ aigov_organization }}"

controller_execution_environments: >-
  {{ [aigov_custom_ee | combine({'credential': aigov_ee_registry_credential}
                                if (aigov_ee_registry_credential | default('') | length) > 0 else {})]
     if (aigov_custom_ee_image | length) > 0 else [] }}
