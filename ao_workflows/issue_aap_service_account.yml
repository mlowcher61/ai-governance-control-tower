---
# AI Governance - Issue AO Service Account (task T2.11)
#
# automation orchestrator launches the governance job templates as the AAP user svc-aigov-ao (not as an administrator),
# so the AAP launch guard can tell an AO launch from a direct one (failure case F-18). This job:
#   1. gives svc-aigov-ao a new random password (AAP platform gateway API);
#   2. creates or updates the AO credential "AI Governance - AAP Service Account" (type Ansible Automation Platform)
#      with it. The password exists only in AAP and AO; it is never printed or stored in git.
# Run it once after configure_aap.yml created the user, then again to rotate. Then run Apply AO Workflows (the
# workflows name this credential in ao_workflows/config/connections.yml).
#
# Credentials: the AAP credential (aigov_aap_credential, an AAP administrator), "AI Governance - Automation Orchestrator".
- name: AI Governance - issue the AO service account credential
  hosts: localhost
  connection: local
  gather_facts: false
  vars_files:
    - config/connections.yml
  vars:
    aigov_ao_service_user: svc-aigov-ao
    aigov_ao_service_credential: AI Governance - AAP Service Account
  tasks:
    - name: Connect to AAP with the attached credential
      ansible.builtin.include_tasks: ../playbooks/e2e/tasks/aap_connection.yml

    - name: Find the service account user
      ansible.builtin.uri:
        url: "{{ aigov_aap_url }}/api/gateway/v1/users/?username={{ aigov_ao_service_user }}"
        headers: "{{ aigov_aap_auth_headers }}"
        url_username: "{{ omit if aigov_aap_auth_headers else aigov_aap_user }}"
        url_password: "{{ omit if aigov_aap_auth_headers else aigov_aap_password }}"
        force_basic_auth: "{{ not aigov_aap_auth_headers }}"
        validate_certs: "{{ aigov_aap_verify }}"
      register: aigov_svc_user
      no_log: true

    - name: Check the user exists (configure_aap.yml creates it)
      ansible.builtin.assert:
        that: aigov_svc_user.json.results | length == 1
        fail_msg: "AAP user {{ aigov_ao_service_user }} not found: run aap_config/configure_aap.yml first."
        quiet: true

    - name: Generate a new password
      ansible.builtin.set_fact:
        aigov_svc_password: "{{ lookup('ansible.builtin.password', '/dev/null', length=48, chars=['ascii_letters', 'digits']) }}"
      no_log: true

    - name: Set the new password in AAP
      ansible.builtin.uri:
        url: "{{ aigov_aap_url }}/api/gateway/v1/users/{{ aigov_svc_user.json.results[0].id }}/"
        method: PATCH
        body_format: json
        body: {password: "{{ aigov_svc_password }}"}
        headers: "{{ aigov_aap_auth_headers }}"
        url_username: "{{ omit if aigov_aap_auth_headers else aigov_aap_user }}"
        url_password: "{{ omit if aigov_aap_auth_headers else aigov_aap_password }}"
        force_basic_auth: "{{ not aigov_aap_auth_headers }}"
        validate_certs: "{{ aigov_aap_verify }}"
      no_log: true

    - name: Check the new password works (controller "me" as the service account)
      ansible.builtin.uri:
        url: "{{ aigov_aap_url }}/api/controller/v2/me/"
        url_username: "{{ aigov_ao_service_user }}"
        url_password: "{{ aigov_svc_password }}"
        force_basic_auth: true
        validate_certs: "{{ aigov_aap_verify }}"
      register: aigov_svc_me
      retries: 6
      delay: 5
      until: aigov_svc_me.status == 200
      no_log: true

    - name: Log in to automation orchestrator
      ansible.builtin.include_tasks: tasks/ao_login.yml

    - name: Read AO credentials, credential types and projects
      ansible.builtin.uri:
        url: "{{ aigov_ao_api }}/{{ item }}?limit=100"
        headers: "{{ aigov_ao_headers }}"
        validate_certs: "{{ aigov_ao_validate_certs }}"
      loop: [credentials, credential_types, projects]
      register: aigov_ao_lists

    - name: Find the AO credential
      ansible.builtin.set_fact:
        aigov_svc_cred: >-
          {{ aigov_ao_lists.results[0].json.resources | selectattr('name', 'equalto', aigov_ao_service_credential) | first | default({}) }}

    - name: Create the AO credential
      when: aigov_svc_cred.id is not defined
      ansible.builtin.uri:
        url: "{{ aigov_ao_api }}/credentials"
        method: POST
        body_format: json
        body:
          name: "{{ aigov_ao_service_credential }}"
          description: AAP user svc-aigov-ao for the governance workflows (issued by AI Governance - Issue AO Service Account)
          credential_type_id: >-
            {{ aigov_ao_lists.results[1].json.resources | selectattr('name', 'equalto', 'Ansible Automation Platform') | map(attribute='id') | first }}
          project_id: "{{ aigov_ao_lists.results[2].json.resources | selectattr('name', 'equalto', aigov_ao_project) | map(attribute='id') | first }}"
          inputs: {username: "{{ aigov_ao_service_user }}", password: "{{ aigov_svc_password }}"}
        headers: "{{ aigov_ao_headers }}"
        validate_certs: "{{ aigov_ao_validate_certs }}"
        status_code: [200, 201]
      changed_when: true
      no_log: true

    - name: Update the AO credential
      when: aigov_svc_cred.id is defined
      ansible.builtin.uri:
        url: "{{ aigov_ao_api }}/credentials/{{ aigov_svc_cred.id }}"
        method: PATCH
        body_format: json
        body:
          inputs: {username: "{{ aigov_ao_service_user }}", password: "{{ aigov_svc_password }}"}
        headers: "{{ aigov_ao_headers }}"
        validate_certs: "{{ aigov_ao_validate_certs }}"
        status_code: [200, 204]
      changed_when: true
      no_log: true

    - name: Report
      ansible.builtin.debug:
        msg: >-
          {{ aigov_ao_service_user }} has a new password, and the AO credential "{{ aigov_ao_service_credential }}" holds it
          ({{ 'updated' if aigov_svc_cred.id is defined else 'created' }}). Run Apply AO Workflows if the workflows do
          not use this credential yet.
