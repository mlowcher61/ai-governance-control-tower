name: CI

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

jobs:
  validate:
    name: Lint and unit tests
    runs-on: ubuntu-latest
    steps:
      - name: Check out the repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install validation tools
        run: pip install ansible-core ansible-lint yamllint cfn-lint ruff pytest boto3 "jsonschema>=4.18" check-jsonschema

      - name: Install collections needed for linting
        # Galaxy equivalents of the certified content pinned in collections/requirements.yml.
        run: ansible-galaxy collection install "amazon.aws:==11.5.0" "kubernetes.core:==6.6.0" -p ./collections

      - name: yamllint
        run: yamllint .

      - name: ansible-lint (production profile)
        run: ansible-lint

      - name: cfn-lint (CloudFormation templates)
        run: cfn-lint --regions us-west-1 -- aws/cloudformation/*.yaml

      - name: ruff (Python)
        run: ruff check demo collections/ansible_collections/mlowcher61 database/tests schemas/tests scripts

      - name: Contracts - schemas are valid JSON Schema 2020-12
        run: check-jsonschema --check-metaschema schemas/*.v1.json

      - name: Contracts - fixtures and examples match the schemas
        run: python -m pytest -q schemas/tests

      - name: ansible-test sanity (project collection)
        working-directory: collections/ansible_collections/mlowcher61/ai_governance
        run: ansible-test sanity --venv --python 3.12

      - name: Unit tests (project collection)
        working-directory: collections
        run: PYTHONPATH="$PWD" python -m pytest -q ansible_collections/mlowcher61/ai_governance/tests/unit

  sql:
    name: Database migrations and SQL tests
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_PASSWORD: postgres
        ports: ["5432:5432"]
        options: >-
          --health-cmd "pg_isready -U postgres" --health-interval 5s --health-timeout 5s --health-retries 10
    env:
      PGHOST: localhost
      PGPORT: "5432"
    steps:
      - name: Check out the repository
        uses: actions/checkout@v4

      - name: Bootstrap roles (as the superuser)
        env: {PGUSER: postgres, PGPASSWORD: postgres}
        run: bash database/tests/ci_setup.sh

      - name: Apply migrations twice (second run must be a no-op)
        env: {PGUSER: aigov_owner, PGPASSWORD: owner, PGDATABASE: aigov}
        run: |
          bash database/migrate.sh database/migrations
          bash database/migrate.sh database/migrations | tee second-run.txt
          grep -q "0 applied" second-run.txt

      - name: Reject an edited migration
        env: {PGUSER: aigov_owner, PGPASSWORD: owner, PGDATABASE: aigov}
        run: |
          mkdir -p /tmp/tampered && cp database/migrations/*.sql /tmp/tampered/
          echo "-- edited" >> /tmp/tampered/V001__baseline.sql
          if bash database/migrate.sh /tmp/tampered; then echo "edited migration was accepted"; exit 1; fi

      - name: SQL tests (as the superuser; they switch to each API role like PostgREST)
        env: {PGUSER: postgres, PGPASSWORD: postgres, PGDATABASE: aigov}
        run: for t in database/tests/test_*.sql; do psql -X -q -v ON_ERROR_STOP=1 -f "$t"; done

      - name: HTTP tests through PostgREST (same image as the cluster)
        run: |
          secret=$(python3 -c 'import secrets; print(secrets.token_hex(32))')
          docker run -d --name postgrest --network host \
            -e PGRST_DB_URI="postgres://aigov_authenticator:auth@localhost:5432/aigov" -e PGRST_DB_SCHEMAS=api \
            -e PGRST_DB_ANON_ROLE=aigov_api_anon -e PGRST_JWT_SECRET="$secret" docker.io/postgrest/postgrest:v16.6
          for _ in $(seq 30); do curl -sf http://127.0.0.1:3000/rpc/health >/dev/null && break; sleep 1; done
          AIGOV_API_URL=http://127.0.0.1:3000 AIGOV_JWT_SECRET="$secret" python3 database/tests/test_api_http.py
          echo "$secret" > /tmp/jwt_secret

      - name: Contract test - discovery fixtures in, policy-input fixtures out
        run: |
          pip install "jsonschema>=4.18"
          AIGOV_API_URL=http://127.0.0.1:3000 AIGOV_JWT_SECRET="$(cat /tmp/jwt_secret)" python3 database/tests/test_contracts_api.py

