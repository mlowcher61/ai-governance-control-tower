---
# AI Governance - Plan Remediation (task T2.04, WF-02 node activity_plan; docs/plan/04 sections 4.4, 4.5, 7.2)
#
# For one open finding:
#   1. read the finding context and capture the PRE-STATE (execution role permissions, runtime tags) read-only;
#   2. derive the actions that fit the pre-state, and ask OPA for authorization (governance.remediation.authz);
#   3. DRY RUN the selected action with the real modules in check mode;
#   4. check the AI recommendation (schemas/ai-recommendation.v1.json; advisory) and compute the blast radius;
#   5. ask OPA for the route (governance.remediation.route): auto, approval, simulate or halt;
#   6. record the remediation (api.begin_remediation; the action is always OPA's choice) and move it to
#      awaiting_approval (approval), approved (auto) or skipped (simulate); write the approval summary.
# With aigov_plan_preview=true (testing) step 6 records nothing: the route is reported with preview=yes.
# Every problem gives route=halt with the reason; nothing is changed in AWS.
#
# Credentials: the AWS bootstrap credential, "AI Governance - AWS Discovery Role",
# "AI Governance - Inventory API (remediator)". Artifacts: schemas/artifacts.v1.json#/$defs/plan.
- name: AI Governance - plan a remediation
  hosts: localhost
  connection: local
  gather_facts: false
  vars:
    aigov_repo_root: "{{ playbook_dir }}/../.."
    aigov_opa_url: http://opa.ai-governance.svc:8181
    aigov_aws_region: us-west-1
    aigov_governance_stack_name: aigov-governance-roles
    aigov_governance_run_id: ""
    aigov_finding_id: ""
    # The AI step's structured output (WF-02 activity_recommend): an object, JSON text, or empty
    aigov_ai_recommendation: {}
    # Preview (testing, docs/plan/09 F-04/F-05): compute and report the route without recording a remediation
    aigov_plan_preview: false
    aigov_plan: {remediation_id: "", route: halt, reason: "not planned", action_type: none, approval_summary: "", rollback_available: "no",
                 halt_outcome: halted, route_precheck: ""}
  tasks:
    - name: Plan, and report any problem as route=halt
      block:
        - name: Check the inputs and credentials
          ansible.builtin.assert:
            that:
              - aigov_finding_id is match('^[0-9a-fA-F-]{36}$')
              - aigov_governance_run_id is match('^[0-9a-fA-F-]{36}$')
              - aigov_discovery_role_arn | default('') | length > 0
            fail_msg: Pass aigov_finding_id and aigov_governance_run_id, and attach the AWS discovery role credential.
            quiet: true

        - name: Check the Inventory API credential (remediator)
          ansible.builtin.include_role:
            name: mlowcher61.ai_governance.inventory_api

        - name: Read the finding context
          ansible.builtin.include_role:
            name: mlowcher61.ai_governance.inventory_api
            tasks_from: rpc
          vars:
            aigov_api_rpc: get_finding_context
            aigov_api_body: {finding_id: "{{ aigov_finding_id }}"}

        - name: Keep the context
          ansible.builtin.set_fact:
            aigov_ctx: "{{ aigov_api_response }}"

        - name: Check the finding can be remediated
          ansible.builtin.assert:
            that:
              - aigov_ctx.finding_status == 'open'
              - aigov_ctx.finding_type == 'violation'
              - aigov_ctx.execution_role | default('', true) | length > 0
            fail_msg: >-
              Finding is {{ aigov_ctx.finding_status }} ({{ aigov_ctx.finding_type }}); only open violations with a known
              execution role are planned.
            quiet: true

        - name: Read the approved policy and boundary from the governance stack
          amazon.aws.cloudformation_info:
            stack_name: "{{ aigov_governance_stack_name }}"
            region: "{{ aigov_aws_region }}"
          register: aigov_gov_stack

        - name: Read the administrator policy list and the action catalog from OPA
          ansible.builtin.uri:
            url: "{{ aigov_opa_url }}/v1/data/governance/{{ item }}"
          loop: [config/admin_policy_arns, remediation_catalog]
          register: aigov_opa_data

        - name: Keep the reference data
          ansible.builtin.set_fact:
            aigov_gov: "{{ aigov_gov_stack.cloudformation[aigov_governance_stack_name].stack_outputs }}"
            aigov_admin_arns: "{{ aigov_opa_data.results[0].json.result }}"
            aigov_catalog: "{{ aigov_opa_data.results[1].json.result }}"

        # ---- 1. Pre-state (read-only) ------------------------------------------------------------------------
        - name: Assume the read-only discovery role
          amazon.aws.sts_assume_role:
            role_arn: "{{ aigov_discovery_role_arn }}"
            external_id: "{{ aigov_discovery_external_id }}"
            role_session_name: "aigov-plan-{{ aigov_governance_run_id[:8] }}-{{ tower_job_id | default(awx_job_id) | default('local') }}"
            duration_seconds: 900
            region: "{{ aigov_ctx.region }}"
          register: aigov_assumed
          no_log: true

        - name: Keep the session
          ansible.builtin.set_fact:
            aigov_aws:
              access_key: "{{ aigov_assumed.sts_creds.access_key }}"
              secret_key: "{{ aigov_assumed.sts_creds.secret_key }}"
              session_token: "{{ aigov_assumed.sts_creds.session_token }}"
          no_log: true

        - name: Capture the execution role (pre-state)
          mlowcher61.ai_governance.iam_role_permissions_info:
            access_key: "{{ aigov_aws.access_key }}"
            secret_key: "{{ aigov_aws.secret_key }}"
            session_token: "{{ aigov_aws.session_token }}"
            region: "{{ aigov_ctx.region }}"
            role_arn: "{{ aigov_ctx.execution_role }}"
          register: aigov_pre_role

        - name: Capture the runtime tags (pre-state)
          mlowcher61.ai_governance.agentcore_runtime_info:
            access_key: "{{ aigov_aws.access_key }}"
            secret_key: "{{ aigov_aws.secret_key }}"
            session_token: "{{ aigov_aws.session_token }}"
            region: "{{ aigov_ctx.region }}"
            agent_runtime_ids: ["{{ aigov_ctx.external_id }}"]
          register: aigov_pre_runtime
          when: aigov_ctx.platform == 'aws.bedrock_agentcore_runtime'

        - name: Assemble the pre-state
          ansible.builtin.set_fact:
            aigov_pre_state: >-
              {{ {'identity': aigov_pre_role.identity, 'identity_evidence': aigov_pre_role.evidence_status,
                  'runtime_tags': ((aigov_pre_runtime.runtimes | default([{}]))[0] | default({})).tags | default({}),
                  'captured_at': now(utc=true, fmt='%Y-%m-%dT%H:%M:%SZ')} }}

        # ---- 2. Authorization ------------------------------------------------------------------------------
        - name: Ask OPA whether and how the finding may be remediated
          ansible.builtin.uri:
            url: "{{ aigov_opa_url }}/v1/data/governance/remediation/authz/decision"
            method: POST
            body_format: json
            body:
              input:
                request: >-
                  {{ {'governance_run_id': aigov_governance_run_id, 'finding_id': aigov_ctx.finding_id, 'policy_id': aigov_ctx.policy_id,
                      'severity': aigov_ctx.severity, 'finding_type': aigov_ctx.finding_type, 'environment': aigov_ctx.environment,
                      'account_ref': aigov_ctx.account_ref, 'platform': aigov_ctx.platform,
                      'remediation_attempts': aigov_ctx.remediation_attempts, 'cooldown_active': aigov_ctx.cooldown_active,
                      'exempt': aigov_ctx.exempt,
                      'applicable_actions': aigov_pre_state.identity | mlowcher61.ai_governance.remediation_applicable_actions(
                                              aigov_admin_arns, aigov_ctx.platform)} }}
          register: aigov_authz_raw

        - name: Keep the decision
          ansible.builtin.set_fact:
            aigov_authz: "{{ aigov_authz_raw.json.result }}"
            aigov_authz_decision_id: "{{ aigov_authz_raw.json.decision_id | default('') }}"

        # ---- 3. Dry run of the selected action (check mode, read-only credentials) ---------------------------
        - name: Dry-run the selected action
          when: aigov_authz.route_precheck == 'eligible'
          block:
            - name: Dry-run iam_replace_managed_policy (attach the approved policy, detach administrator policies)
              when: aigov_authz.selected_action == 'iam_replace_managed_policy'
              mlowcher61.ai_governance.iam_role_managed_policies:
                access_key: "{{ aigov_aws.access_key }}"
                secret_key: "{{ aigov_aws.secret_key }}"
                session_token: "{{ aigov_aws.session_token }}"
                region: "{{ aigov_ctx.region }}"
                role_name: "{{ aigov_ctx.execution_role | regex_replace('^.*/', '') }}"
                managed_policies: >-
                  {{ (aigov_pre_state.identity.policies | selectattr('type', 'in', ['aws_managed', 'customer_managed'])
                      | map(attribute='ref') | reject('in', aigov_admin_arns) | list) + [aigov_gov.ApprovedAgentRuntimePolicyArn] }}
                purge_policies: true
              check_mode: true
              register: aigov_dry_iam

            - name: Dry-run iam_apply_permissions_boundary
              when: aigov_authz.selected_action == 'iam_apply_permissions_boundary'
              mlowcher61.ai_governance.iam_role_managed_policies:
                access_key: "{{ aigov_aws.access_key }}"
                secret_key: "{{ aigov_aws.secret_key }}"
                session_token: "{{ aigov_aws.session_token }}"
                region: "{{ aigov_ctx.region }}"
                role_name: "{{ aigov_ctx.execution_role | regex_replace('^.*/', '') }}"
                managed_policies: []
                purge_policies: false
                permissions_boundary: "{{ aigov_gov.AgentRuntimeBoundaryPolicyArn }}"
              check_mode: true
              register: aigov_dry_boundary

            - name: Dry-run agentcore_apply_governance_tags
              when: aigov_authz.selected_action == 'agentcore_apply_governance_tags'
              mlowcher61.ai_governance.agentcore_runtime_tags:
                access_key: "{{ aigov_aws.access_key }}"
                secret_key: "{{ aigov_aws.secret_key }}"
                session_token: "{{ aigov_aws.session_token }}"
                region: "{{ aigov_ctx.region }}"
                resource_arn: "{{ aigov_ctx.resource_ref }}"
                tags: "{{ aigov_ctx | mlowcher61.ai_governance.remediation_governance_tags }}"
                purge_tags: false
              check_mode: true
              register: aigov_dry_tags

        - name: Record the planned change
          vars:
            sel: "{{ aigov_authz.selected_action }}"
          ansible.builtin.set_fact:
            aigov_planned: >-
              {{ {'action': sel, 'target': aigov_ctx.execution_role if aigov_catalog[sel].target | default('') == 'execution_role'
                                           else aigov_ctx.resource_ref}
                 | combine({'attach': aigov_dry_iam.attached, 'detach': aigov_dry_iam.detached} if sel == 'iam_replace_managed_policy' else {})
                 | combine({'boundary_before': aigov_dry_boundary.boundary_before, 'boundary_after': aigov_gov.AgentRuntimeBoundaryPolicyArn}
                           if sel == 'iam_apply_permissions_boundary' else {})
                 | combine({'tags_add': aigov_dry_tags.added} if sel == 'agentcore_apply_governance_tags' else {})
                 if aigov_authz.route_precheck == 'eligible' and sel in aigov_catalog else {'action': sel} }}
            # true when the action has a check-mode implementation here and it reported the change
            aigov_dry_run_ok: >-
              {{ (aigov_authz.selected_action == 'iam_replace_managed_policy' and aigov_dry_iam is succeeded and aigov_dry_iam.changed)
                         or (aigov_authz.selected_action == 'iam_apply_permissions_boundary' and aigov_dry_boundary is succeeded)
                         or (aigov_authz.selected_action == 'agentcore_apply_governance_tags' and aigov_dry_tags is succeeded) }}

        # ---- 4. AI recommendation (advisory) and blast radius ----------------------------------------------------
        # The AI step is advisory and may fail (WF-02 continues on failure): anything that is not a JSON object counts
        # as no recommendation, which forces approval; it never stops the plan.
        - name: Read the AI recommendation (an object, JSON text, or nothing)
          block:
            - name: Parse the AI recommendation
              ansible.builtin.set_fact:
                aigov_ai_rec: >-
                  {{ aigov_ai_recommendation if aigov_ai_recommendation is mapping
                     else (aigov_ai_recommendation | from_json
                           if aigov_ai_recommendation is string and aigov_ai_recommendation | trim is match('^[{]') else {}) }}
          rescue:
            - name: Treat unreadable AI output as no recommendation
              ansible.builtin.set_fact:
                aigov_ai_rec: {}

        # WF-02 passes the WHOLE AI step output (${activity_recommend}): when the AI step failed, AO has no "result" to
        # resolve and a reference to ${activity_recommend.result.content} would fail the Plan step (F-04, T2.12).
        # Shapes seen on AO API 1.3.2: success {agent_type, id, result: {content}, status, timestamp};
        # failure {error, output, status, invocation_id, ...}.
        - name: Take the recommendation out of an automation orchestrator step output
          ansible.builtin.set_fact:
            aigov_ai_rec: >-
              {{ (((aigov_ai_rec.result | default({}, true)).content | default({}, true))
                  if aigov_ai_rec is mapping and aigov_ai_rec.summary is not defined
                     and (aigov_ai_rec.result is defined or aigov_ai_rec.invocation_id is defined
                          or aigov_ai_rec.agent_type is defined or aigov_ai_rec.error is defined)
                  else aigov_ai_rec) }}

        - name: Accept only an object as the AI recommendation
          ansible.builtin.set_fact:
            aigov_ai_rec: "{{ aigov_ai_rec if aigov_ai_rec is mapping else {} }}"

        - name: Check the AI recommendation and compute the blast radius
          vars:
            aigov_ai_errors: >-
              {{ (aigov_ai_rec | ansible.utils.validate(
                    lookup('ansible.builtin.file', aigov_repo_root ~ '/schemas/bundled/ai-recommendation.v1.json') | from_json,
                    engine='ansible.utils.jsonschema', draft='2020-12')) if aigov_ai_rec is mapping and aigov_ai_rec else [] }}
          ansible.builtin.set_fact:
            aigov_ai: "{{ aigov_ai_rec | mlowcher61.ai_governance.remediation_ai_check(aigov_ai_errors, aigov_authz) }}"
            aigov_blast: >-
              {{ aigov_ctx.agents_sharing_role | mlowcher61.ai_governance.remediation_blast_radius(
                   aigov_pre_state.identity, aigov_pre_state.identity_evidence) }}

        # ---- 5. Route ------------------------------------------------------------------------------------------------
        - name: Ask OPA for the route
          ansible.builtin.uri:
            url: "{{ aigov_opa_url }}/v1/data/governance/remediation/route/decision"
            method: POST
            body_format: json
            body:
              input:
                authz: "{{ aigov_authz }}"
                dry_run_succeeded: "{{ 'yes' if aigov_dry_run_ok | bool else 'no' }}"
                ai_agrees: "{{ aigov_ai.ai_agrees }}"
                blast_radius: {shared_role: "{{ aigov_blast.shared_role }}"}
          register: aigov_route_raw

        - name: Keep the route
          ansible.builtin.set_fact:
            aigov_route: "{{ aigov_route_raw.json.result }}"
            aigov_rollback: >-
              {{ ((aigov_catalog[aigov_authz.selected_action] | default({})).reversible | default(false)
                  and aigov_pre_state.identity_evidence == 'collected') | bool }}

        # ---- 6. Record the remediation -------------------------------------------------------------------------------
        - name: Record the planned remediation
          when: aigov_route.route in ['auto', 'approval', 'simulate'] and not (aigov_plan_preview | bool)
          block:
            - name: Begin the remediation (the action is OPA's selected action)
              ansible.builtin.include_role:
                name: mlowcher61.ai_governance.inventory_api
                tasks_from: rpc
              vars:
                aigov_api_rpc: begin_remediation
                # The AI output is stored only when it matched its contract (it stays advisory either way)
                aigov_api_body: >-
                  {{ {'governance_run_id': aigov_governance_run_id, 'finding_id': aigov_ctx.finding_id,
                      'action_type': aigov_authz.selected_action,
                      'mode': 'dry_run' if aigov_route.route == 'simulate' else 'enforce',
                      'authz_decision': aigov_authz | combine({'decision_id': aigov_authz_decision_id}),
                      'ai_recommendation_accepted': aigov_ai.accepted | bool,
                      'planned_change': aigov_planned | combine({'blast_radius': aigov_blast, 'route': aigov_route}),
                      'pre_state': aigov_pre_state}
                     | combine({'ai_recommendation': aigov_ai_rec} if aigov_ai.ai_agrees != 'invalid' else {}) }}

            - name: Keep the remediation ID
              ansible.builtin.set_fact:
                aigov_remediation_id: "{{ aigov_api_response.remediation_id }}"

            - name: Move the remediation to its route's status
              ansible.builtin.include_role:
                name: mlowcher61.ai_governance.inventory_api
                tasks_from: rpc
              vars:
                aigov_api_rpc: update_remediation
                aigov_api_body:
                  remediation_id: "{{ aigov_remediation_id }}"
                  status: "{{ {'approval': 'awaiting_approval', 'auto': 'approved', 'simulate': 'skipped'}[aigov_route.route] }}"
                  aap_job_id: "{{ (tower_job_id | default(awx_job_id) | default(0)) | int }}"

        - name: Write the approval summary (automation orchestrator shows at most 2000 characters)
          vars:
            aigov_summary_full: >-
              {{ lookup('ansible.builtin.template', 'templates/approval_summary.md.j2')
                 if aigov_route.route in ['auto', 'approval', 'simulate'] else '' }}
          ansible.builtin.set_fact:
            aigov_summary: >-
              {{ aigov_summary_full if aigov_summary_full | length <= 2000
                 else aigov_summary_full[:1880] ~ '\n\n... (shortened; the full plan is in the remediation record)' }}

        - name: Build the plan artifacts
          ansible.builtin.set_fact:
            aigov_plan: >-
              {{ {'remediation_id': aigov_remediation_id | default(''), 'route': aigov_route.route, 'reason': aigov_route.reason,
                  'action_type': aigov_authz.selected_action, 'rollback_available': 'yes' if aigov_rollback | bool else 'no',
                  'ai_agrees': aigov_ai.ai_agrees if aigov_ai.ai_agrees in ['yes', 'no', 'invalid'] else 'unknown',
                  'blast_radius': aigov_blast.shared_role, 'route_precheck': aigov_authz.route_precheck | default(''),
                  'preview': 'yes' if aigov_plan_preview | bool else 'no',
                  'halt_outcome': aigov_authz.route_precheck if aigov_authz.route_precheck | default('') in ['detect_only', 'denied']
                                  else 'halted',
                  'approval_summary': aigov_summary} }}

      rescue:
        - name: Report the problem as route=halt
          ansible.builtin.set_fact:
            aigov_plan: >-
              {{ aigov_plan | combine({'route': 'halt', 'remediation_id': aigov_remediation_id | default(''), 'halt_outcome': 'halted',
                                       'route_precheck': (aigov_authz | default({})).route_precheck | default(''),
                                       'reason': ('not planned: ' if ansible_failed_result.assertion is defined else 'planning failed: ')
                                                 ~ ((ansible_failed_result.msg | default('unknown error')) | string)[:400]}) }}

    - name: Check the artifacts against their contract
      ansible.builtin.assert:
        that: >-
          aigov_plan | ansible.utils.validate(
            lookup('ansible.builtin.file', aigov_repo_root ~ '/schemas/bundled/artifacts.v1.json') | from_json
            | combine({'$ref': '#/$defs/plan'}), engine='ansible.utils.jsonschema', draft='2020-12') | length == 0
        fail_msg: "The plan does not match schemas/artifacts.v1.json#/$defs/plan: {{ aigov_plan }}"
        quiet: true

    - name: Show the plan
      ansible.builtin.debug:
        msg:
          route: "{{ aigov_plan.route }}"
          reason: "{{ aigov_plan.reason }}"
          action: "{{ aigov_plan.action_type }}"
          remediation_id: "{{ aigov_plan.remediation_id }}"
          summary: "{{ aigov_plan.approval_summary.split('\n') }}"

    - name: Publish the plan for automation orchestrator
      ansible.builtin.set_stats:
        data: "{{ aigov_plan }}"
        per_host: false
