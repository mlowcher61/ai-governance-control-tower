---
# AI Governance - Check Inventory (T1.06 acceptance, reused by the Stage 1 end-to-end test)
#
# Read-only. Reads the Inventory API as the evaluator role and checks:
#   * the expected number of agents is in the inventory and none is missing;
#   * the evidence domains discovery can collect are 'collected' (no AccessDenied);
#   * each agent's policy input (api.evaluation_inputs + an evaluation block) matches the policy input
#     contract (schemas/bundled/policy-input.v1.json);
#   * optional expectations per agent: which policies its execution role must, or must not, carry, and
#     whether it is registered (set aigov_expected_registration: {} to skip, for example before the registry is loaded);
#   * once evaluated: each agent's compliance status, risk category and exact set of open findings.
#
# Credential: "AI Governance - Inventory API (evaluator)".
- name: AI Governance - check the governance inventory
  hosts: localhost
  connection: local
  gather_facts: false
  vars:
    aigov_repo_root: "{{ playbook_dir }}/../.."
    aigov_expected_agents: 4
    aigov_collectable_evidence: [agent, tags, identity, identity_simulation]
    # agent name -> policy names its execution role must (or must not) have
    aigov_expected_policies:
      quick_helper_bot: {must: [AdministratorAccess]}
      payments_dispute_assistant: {must: [aigov-approved-agentcore-runtime-basic], must_not: [AdministratorAccess]}
      hr_faq_agent: {must: [aigov-approved-agentcore-runtime-basic], must_not: [AdministratorAccess]}
      research_runtime: {must: [aigov-approved-agentcore-runtime-basic], must_not: [AdministratorAccess]}
    # agent name -> expected registration status (empty = not checked)
    aigov_expected_registration:
      payments_dispute_assistant: registered
      hr_faq_agent: registered
      research_runtime: registered
      quick_helper_bot: unregistered
    # Expected evaluation outcome per agent (checked for agents that have been evaluated; {} = not checked)
    aigov_expected_evaluation:
      payments_dispute_assistant: {status: compliant, risk: low, findings: []}
      quick_helper_bot:
        status: noncompliant
        risk: critical
        findings: [AIGOV-DATA-001, AIGOV-IAM-001, AIGOV-MDL-001, AIGOV-OWN-001, AIGOV-REG-001, AIGOV-RSK-001, AIGOV-TAG-001]
      hr_faq_agent: {status: noncompliant, risk: low, findings: [AIGOV-RSK-001]}
      research_runtime: {status: unknown, risk: low, findings: [AIGOV-MDL-001]}
  tasks:
    - name: Check the Inventory API credential
      ansible.builtin.include_role:
        name: mlowcher61.ai_governance.inventory_api

    - name: Read the agent overview
      ansible.builtin.include_role:
        name: mlowcher61.ai_governance.inventory_api
        tasks_from: view
      vars:
        aigov_api_view: agent_overview
        aigov_api_query: order=name

    - name: Keep the overview
      ansible.builtin.set_fact:
        aigov_overview: "{{ aigov_api_response }}"

    - name: Read the open findings
      ansible.builtin.include_role:
        name: mlowcher61.ai_governance.inventory_api
        tasks_from: view
      vars:
        aigov_api_view: findings_open
        aigov_api_query: select=agent_name,policy_id,finding_type,severity

    - name: Keep the open findings
      ansible.builtin.set_fact:
        aigov_open_findings: "{{ aigov_api_response }}"

    - name: Read the policy inputs
      ansible.builtin.include_role:
        name: mlowcher61.ai_governance.inventory_api
        tasks_from: view
      vars:
        aigov_api_view: evaluation_inputs

    - name: Add the evaluation block the Evaluate job adds, and validate each input against the contract
      vars:
        aigov_schema: "{{ lookup('ansible.builtin.file', aigov_repo_root ~ '/schemas/bundled/policy-input.v1.json') | from_json }}"
        aigov_eval:
          governance_run_id: 00000000-0000-4000-8000-000000000000
          evaluated_at: "{{ now(utc=true, fmt='%Y-%m-%dT%H:%M:%SZ') }}"
          purpose: assessment
      ansible.builtin.set_fact:
        aigov_input_problems: >-
          {{ aigov_input_problems | default([]) + [{'agent': item.input.agent.name, 'errors':
             (item.input | combine({'evaluation': aigov_eval}))
             | ansible.utils.validate(aigov_schema, engine='ansible.utils.jsonschema', draft='2020-12')}] }}
        aigov_inputs: "{{ aigov_inputs | default({}) | combine({item.input.agent.name: item.input}) }}"
      loop: "{{ aigov_api_response }}"
      loop_control:
        label: "{{ item.input.agent.name }}"

    - name: Work out the problems
      ansible.builtin.set_fact:
        aigov_problems: >-
          {%- set p = [] -%}
          {%- if aigov_overview | rejectattr('missing_since') | list | length != aigov_expected_agents | int -%}
          {%- set _ = p.append('expected ' ~ aigov_expected_agents ~ ' present agents, found '
                               ~ (aigov_overview | rejectattr('missing_since') | map(attribute='name') | list)) -%}
          {%- endif -%}
          {%- for a in aigov_overview -%}
          {%- for d in aigov_collectable_evidence if a.evidence_status[d] | default('missing') != 'collected' -%}
          {%- set _ = p.append(a.name ~ ': evidence ' ~ d ~ ' is ' ~ a.evidence_status[d] | default('missing')) -%}
          {%- endfor -%}
          {%- endfor -%}
          {%- for a in aigov_overview if a.name in aigov_expected_registration
                and a.registration_status != aigov_expected_registration[a.name] -%}
          {%- set _ = p.append(a.name ~ ': registration is ' ~ a.registration_status ~ ', expected '
                               ~ aigov_expected_registration[a.name]) -%}
          {%- endfor -%}
          {%- for a in aigov_overview if a.name in aigov_expected_evaluation and a.compliance_status != 'not_evaluated' -%}
          {%- set e = aigov_expected_evaluation[a.name] -%}
          {%- set have = aigov_open_findings | selectattr('agent_name', 'equalto', a.name) | map(attribute='policy_id') | sort | list -%}
          {%- if a.compliance_status != e.status -%}
          {%- set _ = p.append(a.name ~ ': compliance is ' ~ a.compliance_status ~ ', expected ' ~ e.status) -%}
          {%- endif -%}
          {%- if a.risk_category != e.risk -%}
          {%- set _ = p.append(a.name ~ ': risk is ' ~ a.risk_category ~ ', expected ' ~ e.risk) -%}
          {%- endif -%}
          {%- if have != e.findings | sort -%}
          {%- set _ = p.append(a.name ~ ': open findings ' ~ have ~ ', expected ' ~ (e.findings | sort)) -%}
          {%- endif -%}
          {%- endfor -%}
          {%- for x in aigov_input_problems | default([]) if x.errors -%}
          {%- set _ = p.append(x.agent ~ ': policy input breaks the contract: ' ~ (x.errors | map(attribute='message') | list)) -%}
          {%- endfor -%}
          {%- for name, e in aigov_expected_policies.items() if name in aigov_inputs -%}
          {%- set have = aigov_inputs[name].identity.policies | map(attribute='name') | list -%}
          {%- for m in e.must | default([]) if m not in have -%}
          {%- set _ = p.append(name ~ ': role should carry ' ~ m ~ ', has ' ~ have) -%}
          {%- endfor -%}
          {%- for m in e.must_not | default([]) if m in have -%}
          {%- set _ = p.append(name ~ ': role must not carry ' ~ m) -%}
          {%- endfor -%}
          {%- endfor -%}
          {{ p }}

    - name: Show the inventory
      ansible.builtin.debug:
        msg: >-
          {{ aigov_overview | map(attribute='name')
             | zip(aigov_overview | map(attribute='registration_status'),
                   aigov_overview | map(attribute='environment'),
                   aigov_overview | map(attribute='compliance_status'),
                   aigov_overview | map(attribute='risk_score'),
                   aigov_overview | map(attribute='open_findings'))
             | map('join', ' | ') | list }}

    - name: Check the inventory
      ansible.builtin.assert:
        that: aigov_problems | length == 0
        fail_msg: "Inventory check failed: {{ aigov_problems }}"
        success_msg: >-
          {{ aigov_overview | length }} agents; evidence collected; every policy input matches the contract;
          execution role policies, registrations and ({{ aigov_overview | rejectattr('compliance_status', 'equalto', 'not_evaluated')
          | list | length }} evaluated) compliance and open findings as expected.
