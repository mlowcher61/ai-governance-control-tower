---
aigov_project:
  name: "{{ aigov_project_name }}"
  description: AI Governance Control Tower automation content
  organization: "{{ aigov_organization }}"
  scm_type: git
  scm_url: "{{ aigov_project_scm_url }}"
  scm_branch: "{{ aigov_project_scm_branch }}"
  scm_clean: true
  scm_update_on_launch: true
  scm_update_cache_timeout: 60
  default_environment: "{{ aigov_execution_environment }}"
  update_project: true
  wait: true

# The SCM credential is attached only when a token was supplied (private repository).
controller_projects: >-
  {{ [aigov_project | combine({'scm_credential': 'AI Governance - GitHub'} if (aigov_scm_token | length) > 0 else {})] }}
