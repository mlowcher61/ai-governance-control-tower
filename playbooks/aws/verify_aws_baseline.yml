---
# AI Governance - Verify AWS Baseline (task T0.07 acceptance)
# Proves least privilege with the IAM policy simulator, running as the read-only discovery
# role (which is also how remediation verification works later):
#   * the discovery role is read-only (no IAM writes, no AgentCore tokens/changes)
#   * the remediation role can change ONLY roles tagged aigov:managed=true, can attach ONLY
#     the approved policy, and can never escalate (PassRole, CreateRole, DeleteAgentRuntime...)
#   * the demo reset role is limited to resources tagged aigov:demo=true
# It also lists the demo AgentCore runtimes through the discovery role.
- name: AI Governance - verify the AWS governance baseline
  hosts: localhost
  gather_facts: false
  vars:
    aigov_aws_region: us-west-1
    aigov_governance_stack_name: aigov-governance-roles
    aigov_demo_stack_name: aigov-demo-agents
    # What the deployed demo execution roles must look like through the read-only modules (T1.04).
    aigov_demo_role_expectations:
      aigov-demo-payments-dispute-assistant: {policy: aigov-approved-agentcore-runtime-basic, admin_probes: denied}
      aigov-demo-quick-helper-bot: {policy: AdministratorAccess, admin_probes: allowed}
      aigov-demo-hr-faq-agent: {policy: aigov-approved-agentcore-runtime-basic, admin_probes: denied}
      aigov-demo-research-runtime: {policy: aigov-approved-agentcore-runtime-basic, admin_probes: denied}
    aigov_admin_probe_checks:
      - {action: "iam:CreateUser"}
      - {action: "iam:AttachRolePolicy"}
      - {action: "iam:PutRolePolicy"}
  tasks:
    - name: Verify the discovery role credential is attached to this job template
      ansible.builtin.assert:
        that:
          - aigov_discovery_role_arn is defined
          - aigov_discovery_external_id is defined
        fail_msg: Attach the credential 'AI Governance - AWS Discovery Role' to this job template.
        quiet: true

    - name: Read the governance and demo stack outputs
      amazon.aws.cloudformation_info:
        stack_name: "{{ item }}"
        region: "{{ aigov_aws_region }}"
      loop:
        - "{{ aigov_governance_stack_name }}"
        - "{{ aigov_demo_stack_name }}"
      register: aigov_stacks

    - name: Collect stack outputs
      ansible.builtin.set_fact:
        aigov_gov: "{{ aigov_stacks.results[0].cloudformation[aigov_governance_stack_name].stack_outputs }}"
        aigov_demo: "{{ aigov_stacks.results[1].cloudformation[aigov_demo_stack_name].stack_outputs }}"

    - name: Assume the read-only discovery role
      amazon.aws.sts_assume_role:
        role_arn: "{{ aigov_discovery_role_arn }}"
        role_session_name: "aigov-verify-{{ tower_job_id | default(awx_job_id | default('local')) }}"
        external_id: "{{ aigov_discovery_external_id }}"
        duration_seconds: 900
        region: "{{ aigov_aws_region }}"
      register: aigov_discovery_session
      no_log: true

    - name: Set discovery session credentials
      ansible.builtin.set_fact:
        aigov_ro:
          access_key: "{{ aigov_discovery_session.sts_creds.access_key }}"
          secret_key: "{{ aigov_discovery_session.sts_creds.secret_key }}"
          session_token: "{{ aigov_discovery_session.sts_creds.session_token }}"
      no_log: true

    - name: Confirm the job is now acting as the discovery role
      amazon.aws.aws_caller_info:
        access_key: "{{ aigov_ro.access_key }}"
        secret_key: "{{ aigov_ro.secret_key }}"
        session_token: "{{ aigov_ro.session_token }}"
        region: "{{ aigov_aws_region }}"
      register: aigov_ro_identity

    - name: Set simulation targets
      ansible.builtin.set_fact:
        aigov_account: "{{ aigov_ro_identity.account }}"
        aigov_governed_role: "{{ aigov_demo.QuickHelperBotRoleArn }}"
        aigov_ungoverned_role: "arn:aws:iam::{{ aigov_ro_identity.account }}:role/aigov-example-ungoverned-role"
        aigov_admin_policy: "arn:aws:iam::aws:policy/AdministratorAccess"

    - name: Simulate the discovery role (must be read-only)
      mlowcher61.ai_governance.iam_policy_simulation_info:
        access_key: "{{ aigov_ro.access_key }}"
        secret_key: "{{ aigov_ro.secret_key }}"
        session_token: "{{ aigov_ro.session_token }}"
        region: "{{ aigov_aws_region }}"
        policy_source_arn: "{{ aigov_gov.DiscoveryRoleArn }}"
        checks:
          - {description: "can list AgentCore runtimes", action: "bedrock-agentcore:ListAgentRuntimes", expected: allowed}
          - {description: "can read IAM role policies", action: "iam:ListAttachedRolePolicies", resource: "{{ aigov_governed_role }}", expected: allowed}
          - {description: "can run the policy simulator", action: "iam:SimulatePrincipalPolicy", expected: allowed}
          - {description: "cannot attach IAM policies", action: "iam:AttachRolePolicy", resource: "{{ aigov_governed_role }}", expected: denied}
          - {description: "cannot detach IAM policies", action: "iam:DetachRolePolicy", resource: "{{ aigov_governed_role }}", expected: denied}
          - {description: "cannot tag AgentCore runtimes", action: "bedrock-agentcore:TagResource", expected: denied}
          - {description: "cannot obtain workload access tokens", action: "bedrock-agentcore:GetWorkloadAccessToken", expected: denied}
          - {description: "cannot delete AgentCore runtimes", action: "bedrock-agentcore:DeleteAgentRuntime", expected: denied}
      register: aigov_sim_discovery

    - name: Simulate the remediation role (scoped, approved policies only, no escalation)
      mlowcher61.ai_governance.iam_policy_simulation_info:
        access_key: "{{ aigov_ro.access_key }}"
        secret_key: "{{ aigov_ro.secret_key }}"
        session_token: "{{ aigov_ro.session_token }}"
        region: "{{ aigov_aws_region }}"
        policy_source_arn: "{{ aigov_gov.RemediationRoleArn }}"
        checks:
          - description: can detach a policy from a governed (tagged) role
            action: iam:DetachRolePolicy
            resource: "{{ aigov_governed_role }}"
            context: [{key: "iam:ResourceTag/aigov:managed", values: ["true"]}]
            expected: allowed
          - description: can attach the APPROVED policy to a governed role
            action: iam:AttachRolePolicy
            resource: "{{ aigov_governed_role }}"
            context:
              - {key: "iam:ResourceTag/aigov:managed", values: ["true"]}
              - {key: "iam:PolicyARN", values: ["{{ aigov_gov.ApprovedAgentRuntimePolicyArn }}"]}
            expected: allowed
          - description: cannot attach AdministratorAccess even to a governed role
            action: iam:AttachRolePolicy
            resource: "{{ aigov_governed_role }}"
            context:
              - {key: "iam:ResourceTag/aigov:managed", values: ["true"]}
              - {key: "iam:PolicyARN", values: ["{{ aigov_admin_policy }}"]}
            expected: denied
          - description: cannot modify a role that is not tagged aigov:managed=true
            action: iam:DetachRolePolicy
            resource: "{{ aigov_ungoverned_role }}"
            expected: denied
          - {description: "cannot pass roles", action: "iam:PassRole", expected: denied}
          - {description: "cannot create roles", action: "iam:CreateRole", expected: denied}
          - {description: "cannot write inline policies", action: "iam:PutRolePolicy", resource: "{{ aigov_governed_role }}", expected: denied}
          - {description: "cannot delete AgentCore runtimes", action: "bedrock-agentcore:DeleteAgentRuntime", expected: denied}
      register: aigov_sim_remediation

    - name: Simulate the demo reset role (demo-tagged resources only)
      mlowcher61.ai_governance.iam_policy_simulation_info:
        access_key: "{{ aigov_ro.access_key }}"
        secret_key: "{{ aigov_ro.secret_key }}"
        session_token: "{{ aigov_ro.session_token }}"
        region: "{{ aigov_aws_region }}"
        policy_source_arn: "{{ aigov_gov.DemoResetRoleArn }}"
        checks:
          - description: can restore AdministratorAccess on a demo role
            action: iam:AttachRolePolicy
            resource: "{{ aigov_governed_role }}"
            context:
              - {key: "iam:ResourceTag/aigov:demo", values: ["true"]}
              - {key: "iam:PolicyARN", values: ["{{ aigov_admin_policy }}"]}
            expected: allowed
          - description: cannot change a non-demo role
            action: iam:AttachRolePolicy
            resource: "{{ aigov_ungoverned_role }}"
            context: [{key: "iam:PolicyARN", values: ["{{ aigov_admin_policy }}"]}]
            expected: denied
          - {description: "cannot pass roles", action: "iam:PassRole", expected: denied}
      register: aigov_sim_reset

    - name: List the demo AgentCore runtimes through the discovery role
      ansible.builtin.command:
        argv:
          - "{{ ansible_playbook_python }}"
          - -c
          - |
            import json, sys, boto3, botocore
            try:
                client = boto3.client("bedrock-agentcore-control", region_name=sys.argv[1])
            except botocore.exceptions.UnknownServiceError:
                print(json.dumps({"available": False, "reason": "boto3 %s in this execution environment has no "
                                  "bedrock-agentcore-control client; use the AI Governance EE" % boto3.__version__}))
                sys.exit(0)
            runtimes = []
            for page in client.get_paginator("list_agent_runtimes").paginate():
                runtimes.extend(page.get("agentRuntimes", []))
            print(json.dumps({"available": True, "runtimes": [
                {"name": r["agentRuntimeName"], "id": r["agentRuntimeId"], "status": r["status"]} for r in runtimes]}))
          - "{{ aigov_aws_region }}"
      environment:
        AWS_ACCESS_KEY_ID: "{{ aigov_ro.access_key }}"
        AWS_SECRET_ACCESS_KEY: "{{ aigov_ro.secret_key }}"
        AWS_SESSION_TOKEN: "{{ aigov_ro.session_token }}"
      register: aigov_runtimes_raw
      changed_when: false

    # T1.04 acceptance on live data: the read-only modules see each demo agent's execution role as deployed.
    - name: Read the demo agents' execution roles through the discovery role
      mlowcher61.ai_governance.iam_role_permissions_info:
        access_key: "{{ aigov_ro.access_key }}"
        secret_key: "{{ aigov_ro.secret_key }}"
        session_token: "{{ aigov_ro.session_token }}"
        region: "{{ aigov_aws_region }}"
        role_name: "{{ item }}"
      loop: "{{ aigov_demo_role_expectations.keys() | list }}"
      register: aigov_demo_roles

    - name: Probe administrator actions for each demo execution role (evidence mode)
      mlowcher61.ai_governance.iam_policy_simulation_info:
        access_key: "{{ aigov_ro.access_key }}"
        secret_key: "{{ aigov_ro.secret_key }}"
        session_token: "{{ aigov_ro.session_token }}"
        region: "{{ aigov_aws_region }}"
        policy_source_arn: "{{ item.identity.principal_ref }}"
        on_error: report
        checks: "{{ aigov_admin_probe_checks }}"
      loop: "{{ aigov_demo_roles.results }}"
      loop_control:
        label: "{{ item.item }}"
      register: aigov_demo_role_sims

    - name: Compare what the read-only modules saw with the deployed demo roles
      vars:
        aigov_role_view: >-
          {{ dict(aigov_demo_roles.results | map(attribute='item')
                  | zip(aigov_demo_roles.results | zip(aigov_demo_role_sims.results))) }}
      ansible.builtin.set_fact:
        aigov_read_module_problems: >-
          {%- set problems = [] -%}
          {%- for role, expect in aigov_demo_role_expectations.items() -%}
          {%- set view, sim = aigov_role_view[role] -%}
          {%- set names = view.identity.policies | map(attribute='name') | list -%}
          {%- if view.evidence_status != 'collected' -%}
          {%- set _ = problems.append(role ~ ': identity evidence ' ~ view.evidence_status) -%}
          {%- endif -%}
          {%- if expect.policy not in names -%}
          {%- set _ = problems.append(role ~ ': expected policy ' ~ expect.policy ~ ', saw ' ~ names) -%}
          {%- endif -%}
          {%- if sim.evidence_status != 'collected' -%}
          {%- set _ = problems.append(role ~ ': simulation evidence ' ~ sim.evidence_status) -%}
          {%- endif -%}
          {%- for action, decision in sim.simulation.items() if decision != expect.admin_probes -%}
          {%- set _ = problems.append(role ~ ': ' ~ action ~ ' is ' ~ decision ~ ', expected ' ~ expect.admin_probes) -%}
          {%- endfor -%}
          {%- endfor -%}
          {{ problems }}
        aigov_read_module_view: >-
          {{ dict(aigov_demo_roles.results | map(attribute='item')
                  | zip(aigov_demo_roles.results | map(attribute='identity') | map(attribute='policies')
                        | map('map', attribute='name') | map('list'))) }}

    - name: Summarize the verification
      ansible.builtin.set_fact:
        aigov_baseline_verification:
          acting_as: "{{ aigov_ro_identity.arn }}"
          discovery_role_read_only: "{{ aigov_sim_discovery.all_passed }}"
          remediation_role_scoped: "{{ aigov_sim_remediation.all_passed }}"
          demo_reset_role_scoped: "{{ aigov_sim_reset.all_passed }}"
          failed_checks: >-
            {{ aigov_sim_discovery.failed_checks + aigov_sim_remediation.failed_checks + aigov_sim_reset.failed_checks }}
          agentcore_listing: "{{ aigov_runtimes_raw.stdout | from_json }}"
          demo_role_policies_seen: "{{ aigov_read_module_view }}"
          read_module_problems: "{{ aigov_read_module_problems }}"

    - name: Show the verification summary
      ansible.builtin.debug:
        var: aigov_baseline_verification

    - name: Publish the verification summary as job artifacts
      ansible.builtin.set_stats:
        data:
          aigov_baseline_verification: "{{ aigov_baseline_verification }}"
        per_host: false

    - name: Fail if any least-privilege check did not match its expectation
      ansible.builtin.assert:
        that:
          - aigov_baseline_verification.failed_checks | length == 0
        fail_msg: "Baseline verification failed: {{ aigov_baseline_verification.failed_checks }}"
        success_msg: All least-privilege checks matched their expected outcomes.

    - name: Fail if the read-only modules did not see the demo roles as deployed
      ansible.builtin.assert:
        that: aigov_baseline_verification.read_module_problems | length == 0
        fail_msg: "Read module check failed: {{ aigov_baseline_verification.read_module_problems }}"
        success_msg: >-
          The read-only modules saw every demo execution role as deployed (AdministratorAccess only on
          quick_helper_bot; administrator probes allowed only there).

    - name: Fail if the demo runtimes are not all READY (when the AgentCore API is available)
      ansible.builtin.assert:
        that:
          - aigov_baseline_verification.agentcore_listing.runtimes | selectattr('status', 'equalto', 'READY') | list | length >= 4
        fail_msg: "Not all demo runtimes are READY: {{ aigov_baseline_verification.agentcore_listing.runtimes }}"
        success_msg: All demo AgentCore runtimes are READY (listed through the read-only discovery role).
      when: aigov_baseline_verification.agentcore_listing.available | bool

    - name: Report that the runtime listing needs the AI Governance EE
      ansible.builtin.debug:
        msg: "Runtime listing skipped - {{ aigov_baseline_verification.agentcore_listing.reason }}"
      when: not (aigov_baseline_verification.agentcore_listing.available | bool)
