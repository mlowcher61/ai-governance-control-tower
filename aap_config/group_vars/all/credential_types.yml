---
# One credential type per AWS governance role. AAP allows only one credential of a given
# type per job template, so separate types also enforce role separation: a job template
# that has only the discovery type can never assume the remediation role.
controller_credential_types:
  - name: AI Governance - AWS Discovery Role
    description: Read-only AWS role (AIGovDiscoveryRole) assumed for discovery, evaluation and verification
    kind: cloud
    inputs:
      fields:
        - {id: role_arn, type: string, label: Role ARN}
        - {id: external_id, type: string, label: External ID, secret: true}
      required: [role_arn, external_id]
    injectors:
      extra_vars:
        aigov_discovery_role_arn: !unsafe "{{ role_arn }}"
        aigov_discovery_external_id: !unsafe "{{ external_id }}"

  - name: AI Governance - AWS Remediation Role
    description: Scoped AWS role (AIGovRemediationRole) assumed only by approved remediation and rollback jobs
    kind: cloud
    inputs:
      fields:
        - {id: role_arn, type: string, label: Role ARN}
        - {id: external_id, type: string, label: External ID, secret: true}
      required: [role_arn, external_id]
    injectors:
      extra_vars:
        aigov_remediation_role_arn: !unsafe "{{ role_arn }}"
        aigov_remediation_external_id: !unsafe "{{ external_id }}"

  - name: AI Governance - AWS Demo Reset Role
    description: AWS role (AIGovDemoResetRole) that restores the demo baseline on demo-tagged resources only
    kind: cloud
    inputs:
      fields:
        - {id: role_arn, type: string, label: Role ARN}
        - {id: external_id, type: string, label: External ID, secret: true}
      required: [role_arn, external_id]
    injectors:
      extra_vars:
        aigov_demo_reset_role_arn: !unsafe "{{ role_arn }}"
        aigov_demo_reset_external_id: !unsafe "{{ external_id }}"

  - name: AI Governance - Automation Orchestrator
    description: >-
      automation orchestrator URL and service-account client credentials (aigov-trigger) used to apply
      governance workflows, start executions and read approvals
    kind: cloud
    inputs:
      fields:
        - {id: ao_url, type: string, label: automation orchestrator URL, help_text: "e.g. https://ao.apps.example.com"}
        - {id: client_id, type: string, label: Client ID}
        - {id: client_secret, type: string, label: Client secret, secret: true}
      required: [ao_url]
    injectors:
      extra_vars:
        aigov_ao_url: !unsafe "{{ ao_url }}"
        aigov_ao_client_id: !unsafe "{{ client_id }}"
        aigov_ao_client_secret: !unsafe "{{ client_secret }}"

  - name: AI Governance - ServiceNow
    description: >-
      ServiceNow instance and account used by WF-02 to open, update and resolve incidents for governance outcomes
      (certified servicenow.itsm). Leave the instance empty to skip notifications; they are then only audited.
    kind: cloud
    inputs:
      fields:
        - {id: instance, type: string, label: ServiceNow instance URL, help_text: "e.g. https://dev12345.service-now.com"}
        - {id: username, type: string, label: Username}
        - {id: password, type: string, label: Password, secret: true}
        - {id: assignment_group, type: string, label: Assignment group (optional), help_text: "Name of the group that receives the incidents"}
      required: []
    injectors:
      env:
        SN_HOST: !unsafe "{{ instance }}"
        SN_USERNAME: !unsafe "{{ username }}"
        SN_PASSWORD: !unsafe "{{ password }}"
      extra_vars:
        aigov_servicenow_assignment_group: !unsafe "{{ assignment_group }}"

  - name: AI Governance - Inventory API
    description: >-
      Governance Inventory API (PostgREST) URL and a JWT for exactly one PostgreSQL role. Tokens are issued
      and rotated by the job template "AI Governance - Issue API Tokens"
    kind: cloud
    inputs:
      fields:
        - {id: api_url, type: string, label: Inventory API URL, help_text: "e.g. http://governance-api.ai-governance.svc:3000"}
        - {id: role, type: string, label: PostgreSQL role, help_text: "Informational; the role is inside the token"}
        - {id: token, type: string, label: JWT, secret: true}
      required: [api_url]
    injectors:
      extra_vars:
        aigov_api_url: !unsafe "{{ api_url }}"
        aigov_api_role: !unsafe "{{ role }}"
        aigov_api_token: !unsafe "{{ token }}"
