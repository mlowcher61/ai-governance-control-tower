---
# AI Governance - Record Approval Decision (tasks T2.05, T2.08, T2.09)
#
# Records a human decision in the inventory (api.record_approval):
#   kind remediation - on a remediation that awaits approval: approved lets Execute run, rejected re-opens the finding;
#   kind rollback    - on a failed or verification_failed remediation: approved lets Rollback run.
# The database refuses an approval by the agent's registered owner (separation of duties, docs/plan/04 section 8).
#
# Two sources:
#   ao (WF-02) - the decision is READ from the automation orchestrator approvals API: the decided approval of the WF-02
#                approval node (aigov_ao_approval_node) whose prompt names this remediation. The approver, notes, time
#                and AO approval ID come from AO, so nobody types them in.
#   manual     - interim, for testing outside WF-02: the decision and approver are launch variables (administrators only).
#
# Credentials: "AI Governance - Inventory API (remediator)"; for ao also "AI Governance - Automation Orchestrator".
# Artifacts: schemas/artifacts.v1.json#/$defs/approval_decision.
- name: AI Governance - record an approval decision
  hosts: localhost
  connection: local
  gather_facts: false
  vars:
    aigov_repo_root: "{{ playbook_dir }}/../.."
    aigov_ao_validate_certs: false
    aigov_approval_source: manual
    aigov_approval_kind: remediation
    aigov_remediation_id: ""
    # manual source
    aigov_decision: ""
    aigov_decided_by: ""
    aigov_decision_notes: ""
    aigov_ao_approval_id: ""
    # ao source
    aigov_ao_workflow_name: AI Governance - WF-02 Closed-Loop Remediation
    aigov_ao_approval_node: "{{ 'approval_rollback' if aigov_approval_kind == 'rollback' else 'approval_remediation' }}"
  tasks:
    - name: Check the inputs
      ansible.builtin.assert:
        that:
          - aigov_remediation_id is match('^[0-9a-fA-F-]{36}$')
          - aigov_approval_kind in ['remediation', 'rollback']
          - aigov_approval_source in ['manual', 'ao']
          - aigov_approval_source == 'ao' or aigov_decision in ['approved', 'rejected']
          - aigov_approval_source == 'ao' or aigov_decided_by | trim | length > 0
          - aigov_approval_source == 'ao' or aigov_decision_notes | trim | length > 0
        fail_msg: >-
          Pass aigov_remediation_id and aigov_approval_kind (remediation or rollback). With aigov_approval_source=manual
          also pass aigov_decision (approved or rejected), aigov_decided_by and aigov_decision_notes.
        quiet: true

    - name: Check the Inventory API credential (remediator)
      ansible.builtin.include_role:
        name: mlowcher61.ai_governance.inventory_api

    # The decision is kept in aigov_rec, never in the aigov_decision* variables: those are job template extra vars, and
    # extra vars override set_fact, so a decision read from AO would be silently replaced by the empty launch default.
    - name: Take the decision from the launch variables (manual source)
      when: aigov_approval_source == 'manual'
      ansible.builtin.set_fact:
        aigov_rec:
          decision: "{{ aigov_decision }}"
          decided_by: "{{ aigov_decided_by | trim }}"
          notes: "{{ aigov_decision_notes | trim }}"
          ao_approval_id: "{{ aigov_ao_approval_id }}"
          decided_at: ""

    - name: Read the decision from automation orchestrator
      when: aigov_approval_source == 'ao'
      block:
        - name: Log in to automation orchestrator
          ansible.builtin.include_tasks: "{{ aigov_repo_root }}/ao_workflows/tasks/ao_login.yml"

        - name: Read the most recent approvals
          ansible.builtin.uri:
            url: "{{ aigov_ao_api }}/approvals?limit=100&sort=-updated_at"
            headers: "{{ aigov_ao_headers }}"
            validate_certs: "{{ aigov_ao_validate_certs }}"
          register: aigov_ao_approvals

        - name: Find the decided approval for this remediation
          vars:
            aigov_matches: >-
              {{ aigov_ao_approvals.json.resources
                 | selectattr('approval_node_id', 'equalto', aigov_ao_approval_node)
                 | selectattr('workflow_context.workflow_name', 'equalto', aigov_ao_workflow_name)
                 | selectattr('prompt', 'string') | selectattr('prompt', 'search', aigov_remediation_id)
                 | selectattr('status', 'in', ['approved', 'rejected', 'expired']) | list }}
          ansible.builtin.set_fact:
            aigov_ao_approval: "{{ aigov_matches | first | default({}) }}"

        - name: Check a decided approval was found
          ansible.builtin.assert:
            that: aigov_ao_approval.id is defined
            fail_msg: >-
              No decided {{ aigov_ao_approval_node }} approval of "{{ aigov_ao_workflow_name }}" names remediation
              {{ aigov_remediation_id }} in automation orchestrator.
            quiet: true

        - name: Take the decision from automation orchestrator
          ansible.builtin.set_fact:
            aigov_rec:
              decision: "{{ aigov_ao_approval.status }}"
              decided_by: "{{ (aigov_ao_approval.decided_by | default({}, true)).name | default('', true) }}"
              notes: "{{ aigov_ao_approval.decision_notes | default('', true) }}"
              ao_approval_id: "{{ aigov_ao_approval.id }}"
              decided_at: "{{ aigov_ao_approval.decided_at | default('', true) }}"

    - name: Record the decision
      ansible.builtin.include_role:
        name: mlowcher61.ai_governance.inventory_api
        tasks_from: rpc
      vars:
        aigov_api_rpc: record_approval
        aigov_api_body: >-
          {{ {'remediation_id': aigov_remediation_id, 'decision': aigov_rec.decision, 'kind': aigov_approval_kind,
              'prompt': ('automation orchestrator approval ' ~ aigov_ao_approval_node ~ ' of ' ~ aigov_ao_workflow_name)
                        if aigov_approval_source == 'ao'
                        else 'recorded by AAP job ' ~ (tower_job_id | default(awx_job_id) | default('local')) ~ ' (manual)'}
             | combine({'decided_by': aigov_rec.decided_by | trim} if aigov_rec.decided_by | trim | length > 0 else {})
             | combine({'decision_notes': aigov_rec.notes | trim} if aigov_rec.notes | trim | length > 0 else {})
             | combine({'ao_approval_id': aigov_rec.ao_approval_id} if aigov_rec.ao_approval_id | length > 0 else {})
             | combine({'decided_at': aigov_rec.decided_at} if aigov_rec.decided_at | length > 0 else {}) }}

    - name: Build the artifacts
      ansible.builtin.set_fact:
        aigov_decision_out:
          remediation_id: "{{ aigov_remediation_id }}"
          decision: "{{ aigov_rec.decision }}"
          kind: "{{ aigov_approval_kind }}"
          decided_by: "{{ aigov_rec.decided_by | trim }}"
          source: "{{ aigov_approval_source }}"
          remediation_status: "{{ aigov_api_response.remediation_status }}"

    - name: Check the artifacts against their contract
      ansible.builtin.assert:
        that: >-
          aigov_decision_out | ansible.utils.validate(
            lookup('ansible.builtin.file', aigov_repo_root ~ '/schemas/bundled/artifacts.v1.json') | from_json
            | combine({'$ref': '#/$defs/approval_decision'}), engine='ansible.utils.jsonschema', draft='2020-12') | length == 0
        fail_msg: "The result does not match schemas/artifacts.v1.json#/$defs/approval_decision: {{ aigov_decision_out }}"
        quiet: true

    - name: Show the decision
      ansible.builtin.debug:
        var: aigov_decision_out

    - name: Publish the decision for automation orchestrator
      ansible.builtin.set_stats:
        data: "{{ aigov_decision_out }}"
        per_host: false
