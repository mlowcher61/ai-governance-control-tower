---
# AI Governance - Run AO Workflow
#
# Starts an execution of a governance workflow (by name), waits for a terminal state, and
# fails unless it completed. Used by the loader acceptance test (T0.08) and, later, by AAP
# jobs that trigger governance workflows.
#
#   ansible-playbook ao_workflows/run_workflow.yml -e 'aigov_ao_workflow_name="AI Governance - Loader Test (as code)"'
- name: AI Governance - run an automation orchestrator workflow
  hosts: localhost
  connection: local
  gather_facts: false
  vars_files:
    - config/connections.yml
  vars:
    aigov_ao_workflow_name: AI Governance - Loader Test (as code)
    aigov_ao_input: {}
    aigov_ao_use_published: true
    aigov_ao_wait: true
    aigov_ao_wait_retries: 60       # x 10 s
  tasks:
    - name: Log in to automation orchestrator
      ansible.builtin.include_tasks: tasks/ao_login.yml

    - name: Run the workflow
      ansible.builtin.include_tasks: tasks/run_one.yml

    - name: Publish the execution ID for downstream jobs
      ansible.builtin.set_stats:
        data:
          ao_execution_id: "{{ aigov_ao_execution.json.id }}"
        per_host: false
