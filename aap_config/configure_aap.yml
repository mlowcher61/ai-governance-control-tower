---
# Configure Ansible Automation Platform for the AI Governance Control Tower (config as code).
#
#   cp aap_config/vars/customer.example.yml aap_config/vars/customer.yml   # then edit
#   export AAP_SERVER=aap.example.com AAP_API_TOKEN=<token>
#   ansible-playbook aap_config/configure_aap.yml
#
# Idempotent: re-running converges AAP to the definitions in aap_config/group_vars/all/.
- name: Configure Ansible Automation Platform for the AI Governance Control Tower
  hosts: localhost
  connection: local
  gather_facts: false
  vars_files:
    - vars/customer.yml
  pre_tasks:
    - name: Check the required connection settings
      ansible.builtin.assert:
        that:
          - aigov_aap_hostname | length > 0
          - lookup('ansible.builtin.env', 'AAP_API_TOKEN') | length > 0
          - (aigov_aws_account_id | string | length) in [0, 12]
        fail_msg: >-
          Set AAP_SERVER and AAP_API_TOKEN in the environment, and aigov_aws_account_id
          (12 digits, or empty on the first run) in aap_config/vars/customer.yml.
        quiet: true

    - name: Explain the first-run behavior when the AWS account is not known yet
      ansible.builtin.debug:
        msg: >-
          aigov_aws_account_id is empty: creating the base objects and the 'AI Governance - Check Environment'
          job template only. Launch it, set the account ID it reports, and re-run this playbook.
      when: (aigov_aws_account_id | string | length) == 0

    # EDA changes an activation only while it is stopped and disabled (and copies the rulebook at creation), so the
    # activation is created once and otherwise left alone; see aap_config/group_vars/all/eda.yml to change it.
    - name: Check whether the EDA activation already exists
      when: aigov_eda_enabled | default(false) | bool
      ansible.builtin.uri:
        url: "https://{{ aigov_aap_hostname }}/api/eda/v1/activations/?name={{ aigov_eda_activation_name | urlencode }}"
        headers:
          Authorization: "Bearer {{ lookup('ansible.builtin.env', 'AAP_API_TOKEN') }}"
        validate_certs: "{{ aap_validate_certs | default(false) }}"
      register: aigov_eda_activation_lookup
      no_log: true

    - name: Remember whether it exists
      ansible.builtin.set_fact:
        aigov_eda_activation_exists: "{{ (aigov_eda_activation_lookup.json.count | default(0) | int) > 0 }}"

  tasks:
    - name: Apply the configuration with infra.aap_configuration
      ansible.builtin.include_role:
        name: infra.aap_configuration.dispatch

  post_tasks:
    # The certified modules do not manage a job template's policy path (opa_query_path); set it through the API.
    # Template updates by infra.aap_configuration leave the field unchanged.
    - name: Attach the AAP launch guard to the remediation templates (T2.11)
      when:
        - aigov_pac_manage | bool
        - (aigov_aws_account_id | string | length) == 12
        - (aigov_openshift_credential | default('') | string | length) > 0
      block:
        - name: Find the guarded job templates
          ansible.builtin.uri:
            url: "https://{{ aigov_aap_hostname }}/api/controller/v2/job_templates/?name={{ item | urlencode }}"
            headers:
              Authorization: "Bearer {{ lookup('ansible.builtin.env', 'AAP_API_TOKEN') }}"
            validate_certs: "{{ aap_validate_certs | default(false) }}"
          loop: "{{ aigov_pac_guarded_templates }}"
          register: aigov_guarded
          no_log: true

        - name: Set the policy path on each guarded template
          ansible.builtin.uri:
            url: "https://{{ aigov_aap_hostname }}/api/controller/v2/job_templates/{{ item.json.results[0].id }}/"
            method: PATCH
            body_format: json
            body: {opa_query_path: "{{ aigov_pac_query_path }}"}
            headers:
              Authorization: "Bearer {{ lookup('ansible.builtin.env', 'AAP_API_TOKEN') }}"
            validate_certs: "{{ aap_validate_certs | default(false) }}"
          loop: "{{ aigov_guarded.results }}"
          loop_control:
            label: "{{ item.item }}"
          when: item.json.results[0].opa_query_path | default('') != aigov_pac_query_path
          changed_when: true
          no_log: true
