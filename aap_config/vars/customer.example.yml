---
# =============================================================================
# Copy this file to aap_config/vars/customer.yml (git-ignored) and adjust it for
# your platform. These are the ONLY values a new user must provide.
# Secrets are never stored here: tokens are read from environment variables.
# =============================================================================

# Platform gateway host (no scheme), e.g. aap.example.com. Defaults to $AAP_SERVER.
aigov_aap_hostname: "{{ lookup('ansible.builtin.env', 'AAP_SERVER') }}"
aigov_aap_validate_certs: true

# Organization and project
aigov_organization: AI Governance
aigov_project_name: AI Governance Control Tower
aigov_project_scm_url: https://github.com/mlowcher61/ai-governance-control-tower.git
aigov_project_scm_branch: main
# Private repository only: GitHub username for the Source Control credential. The token is read
# from $AIGOV_SCM_TOKEN (or $GITHUB_TOKEN); with neither set, no SCM credential is created.
aigov_project_scm_username: mlowcher61

# Execution environment used by the governance job templates. The quickest start is the prebuilt public
# image below: this playbook registers it in AAP as "AI Governance EE" (proven on a fresh cluster).
# To use your own build instead (scripts/build_ee.sh), point aigov_custom_ee_image at it; for a private
# registry also set aigov_ee_registry_credential. It needs boto3 >= 1.40 for the AgentCore APIs.
aigov_execution_environment: AI Governance EE
aigov_custom_ee_image: quay.io/locust61/ai-governance-ee:0.1.0
# Container Registry credential AAP uses to pull that image (empty for a public image). Use an existing credential name, or export
# AIGOV_REGISTRY_USERNAME/AIGOV_REGISTRY_PASSWORD to have it created for aigov_ee_registry_host.
aigov_ee_registry_credential: ""
aigov_ee_registry_host: quay.io   # e.g. your private hub host for a private build

# Private automation hub used for collection installs during project sync.
# The token is read from $AIGOV_HUB_TOKEN (falls back to $AAP_API_TOKEN).
aigov_private_hub_url: "https://{{ aigov_aap_hostname }}/api/galaxy/content"

# AWS target for the demo and governance roles
aigov_aws_region: us-west-1
# 12-digit account ID of the governed AWS account. Leave empty on the very first run:
# launch "AI Governance - Check Environment" to discover it, then set it and re-run.
aigov_aws_account_id: ""

# Existing AAP credential (name or numeric ID) of type "Amazon Web Services" used as the
# bootstrap principal. It is used to deploy the governance stacks and to assume the
# governance roles; it never performs discovery or remediation directly.
aigov_aws_bootstrap_credential: "AI Governance - AWS Bootstrap"

# Governance platform services (T0.06) on OpenShift. Name (or numeric ID) of an EXISTING AAP credential of
# type "OpenShift or Kubernetes API Bearer Token" whose token may manage the namespace below
# (empty = skip the Deploy Platform Services job template).
aigov_openshift_credential: ""
aigov_platform_namespace: ai-governance
# Namespaces whose pods may call OPA and the Inventory API (AAP job pods and the AO worker).
aigov_platform_trusted_namespaces: [aap, automation-orchestrator]

# Inventory API tokens (T1.02). Name (or numeric ID) of an EXISTING AAP credential of type
# "Red Hat Ansible Automation Platform" that may update credentials in the organization above. The job
# template "AI Governance - Issue API Tokens" uses it to store the signed tokens (empty = skip it).
aigov_aap_credential: ""
aigov_api_token_ttl_days: 90

# automation orchestrator (T0.08). AO route URL, e.g. https://ao.apps.example.com (empty = skip the AO
# credential and job templates). See ao_workflows/README.md.
aigov_ao_url: ""

# ServiceNow incidents for WF-02 outcomes (T2.10). The URL is not a secret; the username and password are entered in
# the AAP credential "AI Governance - ServiceNow" (or exported as AIGOV_SERVICENOW_USERNAME / AIGOV_SERVICENOW_PASSWORD
# when running configure_aap.yml). Leave empty to skip notifications (they are still audited).
aigov_servicenow_instance: ""
aigov_servicenow_assignment_group: ""
# Namespace of the AO installation (used by "AI Governance - Configure AO Network Allowlist").
aigov_ao_namespace: automation-orchestrator
# LLM model the AI explanation step uses (name in the AO LLM integration); recorded with each explanation.
aigov_ao_llm_model: llama-scout-17b
# Grafana URL shown in the assessment summary (printed by Deploy Platform Services). Optional.
aigov_grafana_url: ""

# Event-Driven Ansible (T3.02). Set to true after "AI Governance - Issue EDA Credentials" has created the EDA
# credentials; configure_aap.yml then creates the rulebook activation "AI Governance - AWS Change Events".
aigov_eda_enabled: false

# Schedules (T3.04): hourly Reconcile and Sweep, nightly assessment at 02:00 UTC. Set to false for a quiet lab.
aigov_schedules_enabled: true
